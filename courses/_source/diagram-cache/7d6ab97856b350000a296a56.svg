<svg xmlns="http://www.w3.org/2000/svg" width="800" height="484" viewBox="0 0 800 484" role="img" aria-labelledby="title desc">
<title id="title">Near zero, relative error alone is the wrong test</title><desc id="desc">The maximum accepted absolute difference is atol plus rtol times the magnitude of the reference b. With atol=1e−5 and rtol=1e−4, the threshold is 1e−5 at b=0 and 1.1e−4 at |b|=1. The positive intercept provides an absolute-error floor.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="484" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Absolute tolerance provides a floor near zero</text><line x1="120" y1="325" x2="710" y2="325" stroke="#e3e8ed" stroke-width="1.5"/><text x="105" y="330" font-size="15" fill="#5d6b76" text-anchor="end">0</text><line x1="120" y1="304.09090909090907" x2="710" y2="304.09090909090907" stroke="#e3e8ed" stroke-width="1.5"/><text x="105" y="309.09090909090907" font-size="15" fill="#5d6b76" text-anchor="end">1e−5</text><line x1="120" y1="95" x2="710" y2="95" stroke="#e3e8ed" stroke-width="1.5"/><text x="105" y="100" font-size="15" fill="#5d6b76" text-anchor="end">1.1e−4</text><line x1="120" y1="325" x2="730" y2="325" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="120" y1="325" x2="120" y2="67" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="120" y="351" font-size="15" fill="#243340" text-anchor="middle">0</text><text x="710" y="351" font-size="15" fill="#243340" text-anchor="middle">1</text><text x="409" y="384" font-size="16" fill="#243340" text-anchor="middle">Reference magnitude |b|</text><text x="127" y="69" font-size="16" fill="#243340" text-anchor="start">Allowed absolute error</text><path d="M 120 304.09090909090907 L 710 95 L 710 325 L 120 325 Z" fill="#dceee9" opacity="0.65"/><line x1="120" y1="304.09090909090907" x2="710" y2="95" stroke="#356e64" stroke-width="3"/><text x="271" y="144" font-size="17" fill="#356e64" text-anchor="start">atol + rtol × |b|</text><text x="30" y="423" font-size="17" fill="#243340" text-anchor="start">Check: |a − b| ≤ 1e−5 + 1e−4 |b|</text><text x="30" y="456" font-size="15" fill="#5d6b76" text-anchor="start">This is an acceptance threshold, not an empirical error curve.</text>
</g></svg>
