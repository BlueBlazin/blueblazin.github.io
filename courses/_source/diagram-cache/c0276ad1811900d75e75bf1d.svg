<svg xmlns="http://www.w3.org/2000/svg" width="800" height="462" viewBox="0 0 800 462" role="img" aria-labelledby="title desc"><title id="title">RMSNorm divides by real features</title><desc id="desc">For a row with three values 1, 2, and 3, a four-lane block pads the final lane with zero. The sum of squares is 14. Divide this by the real feature width 3, not the padded width 4, before adding epsilon and computing the inverse square root. Multiply by the input and feature weight and mask the output store.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="462" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="36" font-size="19" fill="#233449" text-anchor="start" font-weight="600">A padded reduction does not change the feature count</text><text x="30" y="75" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Three real features, padded to four lanes</text><rect x="208" y="108" width="104" height="57" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="260" y="143" font-size="21" fill="#233449" text-anchor="middle" font-weight="400">1</text><rect x="333" y="108" width="104" height="57" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="385" y="143" font-size="21" fill="#233449" text-anchor="middle" font-weight="400">2</text><rect x="458" y="108" width="104" height="57" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="510" y="143" font-size="21" fill="#233449" text-anchor="middle" font-weight="400">3</text><rect x="583" y="108" width="104" height="57" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="635" y="143" font-size="21" fill="#233449" text-anchor="middle" font-weight="400">0</text><text x="260" y="193" font-size="16" fill="#596579" text-anchor="middle" font-weight="400">valid</text><text x="385" y="193" font-size="16" fill="#596579" text-anchor="middle" font-weight="400">valid</text><text x="510" y="193" font-size="16" fill="#596579" text-anchor="middle" font-weight="400">valid</text><text x="635" y="193" font-size="16" fill="#596579" text-anchor="middle" font-weight="400">padding</text><line x1="260" y1="207" x2="260" y2="233" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="385" y1="207" x2="385" y2="233" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="510" y1="207" x2="510" y2="233" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="635" y1="207" x2="635" y2="233" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="153" y="248" width="544" height="62" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="425" y="286" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">Sum of squares = 1 + 4 + 9 + 0 = 14</text><text x="30" y="356" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Divide by the actual width N = 3:</text><text x="413" y="356" font-size="19" fill="#233449" text-anchor="start" font-weight="400">mean square = 14 / 3</text><text x="30" y="403" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Then add ε, take the inverse square root, multiply by x and w.</text><text x="30" y="435" font-size="16" fill="#596579" text-anchor="start" font-weight="400">The padded lane is never stored; dividing by 4 would change the result.</text></g></svg>
