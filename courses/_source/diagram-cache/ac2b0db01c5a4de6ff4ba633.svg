<svg xmlns="http://www.w3.org/2000/svg" width="800" height="471" viewBox="0 0 800 471" role="img" aria-labelledby="title desc"><title id="title">Startup, overlap and drain in a staged pipeline</title><desc id="desc">A generic two-buffer schedule loads tile zero in slot zero, then computes it while loading tile one. Slot two computes tile one while loading tile two into buffer zero, which is reusable only because tile zero’s consumer finished at the prior slot boundary. The final slot drains tile two’s computation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="471" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Overlap needs independent buffers and correct reuse ordering</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Illustrative schedule: three tiles, two buffers, equal transfer/compute slots; not measured.</text><text x="255" y="114" font-size="16" fill="#596579" text-anchor="middle" font-weight="400">Slot 0</text><text x="397" y="114" font-size="16" fill="#596579" text-anchor="middle" font-weight="400">Slot 1</text><text x="539" y="114" font-size="16" fill="#596579" text-anchor="middle" font-weight="400">Slot 2</text><text x="681" y="114" font-size="16" fill="#596579" text-anchor="middle" font-weight="400">Slot 3</text><text x="30" y="168" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Transfer</text><text x="30" y="253" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Compute</text><rect x="189" y="135" width="132" height="57" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="255.0" y="158.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Tile 0</text><text x="255.0" y="181.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">buffer 0</text><rect x="331" y="220" width="132" height="57" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="397.0" y="243.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Tile 0</text><text x="397.0" y="266.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">buffer 0</text><line x1="255" y1="196" x2="397" y2="212" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="331" y="135" width="132" height="57" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="397.0" y="158.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Tile 1</text><text x="397.0" y="181.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">buffer 1</text><rect x="473" y="220" width="132" height="57" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="539.0" y="243.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Tile 1</text><text x="539.0" y="266.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">buffer 1</text><line x1="397" y1="196" x2="539" y2="212" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="473" y="135" width="132" height="57" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="539.0" y="158.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Tile 2</text><text x="539.0" y="181.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">buffer 0</text><rect x="615" y="220" width="132" height="57" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="681.0" y="243.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Tile 2</text><text x="681.0" y="266.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">buffer 0</text><line x1="539" y1="196" x2="681" y2="212" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><text x="255" y="332" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Startup</text><text x="468" y="332" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Overlap</text><text x="680" y="332" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Drain</text><line x1="187" y1="353" x2="749" y2="353" stroke="#b9c4d0" stroke-width="1.5"/><text x="30" y="401" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Tile 2 reuses buffer 0 only after tile 0’s consumer has finished.</text><text x="30" y="443" font-size="16" fill="#596579" text-anchor="start" font-weight="400">The official example’s actual stage count and waits must come from its source.</text></g></svg>
