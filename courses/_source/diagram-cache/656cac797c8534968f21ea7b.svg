<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">RoPE rotates a pair without stretching it</title><desc id="desc">A unit vector starting at coordinates (1,0) is rotated counterclockwise by 60 degrees to (one half, square root of three over two). Both endpoints lie on the same unit circle. This illustrates one adjacent channel pair in Q or K; the position and pair frequency choose the angle.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="450" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="35" y="32" font-size="18" fill="#243340" text-anchor="start" font-weight="600">One adjacent channel pair</text><circle cx="236" cy="242" r="140" fill="none" stroke="#b7c3cc" stroke-dasharray="5 5"/><line x1="48" y1="242" x2="421" y2="242" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="236" y1="418" x2="236" y2="52" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="409" y="268" font-size="17" fill="#243340" text-anchor="start">a</text><text x="253" y="66" font-size="17" fill="#243340" text-anchor="start">b</text><line x1="236" y1="242" x2="376" y2="242" stroke="#365e7e" stroke-width="3" marker-end="url(#arrow)"/><line x1="236" y1="242" x2="306.0" y2="120.7564434701786" stroke="#356e64" stroke-width="3" marker-end="url(#arrow)"/><path d="M 296 242 A 60 60 0 0 0 266 190.0385" fill="none" stroke="#5d6b76" stroke-width="1.5" marker-end="url(#arrow)"/><text x="300" y="215" font-size="16" fill="#243340" text-anchor="start">60°</text><text x="359" y="284" font-size="17" fill="#365e7e" text-anchor="start">(1, 0)</text><text x="304" y="99" font-size="17" fill="#356e64" text-anchor="start">(½, √3/2)</text><text x="245" y="264" font-size="15" fill="#5d6b76" text-anchor="start">0</text><text x="478" y="100" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Same length, new direction</text><text x="478" y="142" font-size="17" fill="#243340" text-anchor="start">At position p:</text><text x="478" y="172" font-size="17" fill="#243340" text-anchor="start">angle = p × pair frequency</text><text x="478" y="220" font-size="17" fill="#243340" text-anchor="start">Rotate Q and K.</text><text x="478" y="248" font-size="17" fill="#243340" text-anchor="start">Leave V unchanged.</text><text x="478" y="306" font-size="16" fill="#5d6b76" text-anchor="start">Each channel pair uses its</text><text x="478" y="331" font-size="16" fill="#5d6b76" text-anchor="start">own frequency; this 60° angle</text><text x="478" y="356" font-size="16" fill="#5d6b76" text-anchor="start">is only a geometric example.</text>
</g></svg>
