<svg xmlns="http://www.w3.org/2000/svg" width="800" height="488" viewBox="0 0 800 488" role="img" aria-labelledby="title desc"><title id="title">Why a mixed error check behaves better near zero</title><desc id="desc">A V-shaped upper envelope gives allowed absolute error as 0.002 plus 0.01 times the magnitude of the reference value. The shaded region below it is accepted. At a zero reference the allowed error is still 0.002, whereas a pure relative criterion would allow zero and relative-error division becomes undefined.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="488" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Absolute tolerance provides a floor near zero</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Illustrative criterion: absolute error ≤ 0.002 + 0.01 × |reference|.</text><polygon points="108.0,354.0 108.0,152.57142857142858 423.0,320.42857142857144 738.0,152.57142857142858 738.0,354.0" fill="#e1f0ec"/><line x1="108" y1="354.0" x2="738" y2="354.0" stroke="#b9c4d0" stroke-width="1.5" stroke-dasharray="5 5"/><text x="96" y="359.0" font-size="15" fill="#596579" text-anchor="end" font-weight="400">0.000</text><line x1="108" y1="320.42857142857144" x2="738" y2="320.42857142857144" stroke="#b9c4d0" stroke-width="1.5" stroke-dasharray="5 5"/><text x="96" y="325.42857142857144" font-size="15" fill="#596579" text-anchor="end" font-weight="400">0.002</text><line x1="108" y1="253.28571428571428" x2="738" y2="253.28571428571428" stroke="#b9c4d0" stroke-width="1.5" stroke-dasharray="5 5"/><text x="96" y="258.2857142857143" font-size="15" fill="#596579" text-anchor="end" font-weight="400">0.006</text><line x1="108" y1="186.14285714285714" x2="738" y2="186.14285714285714" stroke="#b9c4d0" stroke-width="1.5" stroke-dasharray="5 5"/><text x="96" y="191.14285714285714" font-size="15" fill="#596579" text-anchor="end" font-weight="400">0.010</text><line x1="108" y1="119.0" x2="738" y2="119.0" stroke="#b9c4d0" stroke-width="1.5" stroke-dasharray="5 5"/><text x="96" y="124.0" font-size="15" fill="#596579" text-anchor="end" font-weight="400">0.014</text><path d="M 108.0 152.57142857142858 L 423.0 320.42857142857144 L 738.0 152.57142857142858" fill="none" stroke="#39756a" stroke-width="1.5"/><line x1="108" y1="119" x2="108" y2="354" stroke="#233449" stroke-width="1.5"/><line x1="108" y1="354" x2="738" y2="354" stroke="#233449" stroke-width="1.5"/><text x="108.0" y="383" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">-1</text><text x="265.5" y="383" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">-0.5</text><text x="423.0" y="383" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">0</text><text x="580.5" y="383" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">0.5</text><text x="738.0" y="383" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">1</text><text x="108" y="105" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Absolute error</text><text x="423" y="420" font-size="16" fill="#233449" text-anchor="middle" font-weight="400">Reference value</text><text x="423" y="340" font-size="16" fill="#39756a" text-anchor="middle" font-weight="400">accepted region</text><text x="30" y="462" font-size="16" fill="#233449" text-anchor="start" font-weight="400">The tolerance floor is 0.002 at reference = 0; relative error alone has no such floor.</text></g></svg>
