<svg xmlns="http://www.w3.org/2000/svg" width="800" height="502" viewBox="0 0 800 502" role="img" aria-labelledby="title desc"><title id="title">Row geometry changes available program parallelism</title><desc id="desc">An eight-by-four matrix and a two-by-sixteen matrix both contain thirty-two elements. A one-program-per-row implementation launches eight programs for the first and two for the second. The latter assigns a wider reduction to each program. Actual speed depends on hardware, launch overhead and per-program resource use.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="502" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Equal element counts can expose different parallel work</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Both examples contain 32 elements; one program owns one row.</text><text x="143" y="116" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">8 rows × 4 features</text><rect x="67" y="140" width="30" height="30" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="99" y="140" width="30" height="30" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="131" y="140" width="30" height="30" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="163" y="140" width="30" height="30" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="67" y="172" width="30" height="30" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="99" y="172" width="30" height="30" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="131" y="172" width="30" height="30" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="163" y="172" width="30" height="30" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="67" y="204" width="30" height="30" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="99" y="204" width="30" height="30" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="131" y="204" width="30" height="30" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="163" y="204" width="30" height="30" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="67" y="236" width="30" height="30" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="99" y="236" width="30" height="30" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="131" y="236" width="30" height="30" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="163" y="236" width="30" height="30" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="67" y="268" width="30" height="30" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="99" y="268" width="30" height="30" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="131" y="268" width="30" height="30" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="163" y="268" width="30" height="30" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="67" y="300" width="30" height="30" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="99" y="300" width="30" height="30" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="131" y="300" width="30" height="30" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="163" y="300" width="30" height="30" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="67" y="332" width="30" height="30" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="99" y="332" width="30" height="30" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="131" y="332" width="30" height="30" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="163" y="332" width="30" height="30" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="67" y="364" width="30" height="30" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="99" y="364" width="30" height="30" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="131" y="364" width="30" height="30" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="163" y="364" width="30" height="30" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><text x="548" y="116" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">2 rows × 16 features</text><rect x="307" y="201" width="26" height="26" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="335" y="201" width="26" height="26" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="363" y="201" width="26" height="26" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="391" y="201" width="26" height="26" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="419" y="201" width="26" height="26" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="447" y="201" width="26" height="26" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="475" y="201" width="26" height="26" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="503" y="201" width="26" height="26" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="531" y="201" width="26" height="26" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="559" y="201" width="26" height="26" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="587" y="201" width="26" height="26" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="615" y="201" width="26" height="26" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="643" y="201" width="26" height="26" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="671" y="201" width="26" height="26" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="699" y="201" width="26" height="26" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="727" y="201" width="26" height="26" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="307" y="229" width="26" height="26" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="335" y="229" width="26" height="26" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="363" y="229" width="26" height="26" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="391" y="229" width="26" height="26" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="419" y="229" width="26" height="26" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="447" y="229" width="26" height="26" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="475" y="229" width="26" height="26" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="503" y="229" width="26" height="26" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="531" y="229" width="26" height="26" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="559" y="229" width="26" height="26" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="587" y="229" width="26" height="26" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="615" y="229" width="26" height="26" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="643" y="229" width="26" height="26" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="671" y="229" width="26" height="26" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="699" y="229" width="26" height="26" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="727" y="229" width="26" height="26" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><text x="143" y="430" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">8 independent programs</text><text x="530" y="319" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">2 independent programs</text><text x="307" y="361" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Wider reduction per program;</text><text x="307" y="391" font-size="17" fill="#233449" text-anchor="start" font-weight="400">fewer programs in the grid.</text><text x="30" y="474" font-size="16" fill="#596579" text-anchor="start" font-weight="400">This predicts a trade-off, not achieved occupancy or which shape is faster.</text></g></svg>
