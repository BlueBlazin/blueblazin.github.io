<svg xmlns="http://www.w3.org/2000/svg" width="800" height="479" viewBox="0 0 800 479" role="img" aria-labelledby="title desc"><title id="title">Match the logit output boundary</title><desc id="desc">Projecting all T prompt hidden states through a D-by-V vocabulary matrix produces T-by-V logits. Selecting only the final hidden row before projection produces one-by-V logits. The conventional multiplication counts are approximately 2TDV and 2DV FLOPs. Merely selecting the last logit row after projecting all positions does not avoid the larger projection.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="479" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">The vocabulary projection may perform T times as many row products</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Same hidden width D and vocabulary V; this is work shape, not measured latency.</text><text x="30" y="105" font-size="18" fill="#233449" text-anchor="start" font-weight="600">All prompt positions</text><rect x="31" y="133" width="176" height="90" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="119.0" y="172.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">T × D</text><text x="119.0" y="195.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">hidden states</text><text x="237" y="187" font-size="24" fill="#233449" text-anchor="middle" font-weight="400">×</text><rect x="270" y="133" width="178" height="90" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="359.0" y="172.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">D × V</text><text x="359.0" y="195.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">projection weights</text><line x1="459" y1="178" x2="505" y2="178" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="517" y="133" width="245" height="90" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="639.5" y="172.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">T × V</text><text x="639.5" y="195.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">logits</text><text x="30" y="277" font-size="18" fill="#233449" text-anchor="start" font-weight="600">Only the selected last position</text><rect x="31" y="305" width="176" height="90" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="119.0" y="344.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">1 × D</text><text x="119.0" y="367.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">hidden states</text><text x="237" y="359" font-size="24" fill="#233449" text-anchor="middle" font-weight="400">×</text><rect x="270" y="305" width="178" height="90" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="359.0" y="344.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">D × V</text><text x="359.0" y="367.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">projection weights</text><line x1="459" y1="350" x2="505" y2="350" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="517" y="305" width="245" height="90" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="639.5" y="344.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">1 × V</text><text x="639.5" y="367.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">logits</text><text x="30" y="450" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Approximate projection FLOPs: 2TDV versus 2DV. Match the chosen output boundary.</text></g></svg>
