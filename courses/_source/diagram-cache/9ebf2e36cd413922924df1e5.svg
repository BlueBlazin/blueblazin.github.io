<svg xmlns="http://www.w3.org/2000/svg" width="800" height="494" viewBox="0 0 800 494" role="img" aria-labelledby="title desc"><title id="title">Load masks protect the reduction as well as the output</title><desc id="desc">Three four-by-four tiles illustrate logical M=3, N=2 and K=1. A has a valid three-row by one-column region, B a one-row by two-column region, and C a three-row by two-column region. A loads are masked on row and K coordinates, B loads on K and column coordinates, and C stores on row and column coordinates. Invalid input positions load zero; invalid output positions are not stored.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="494" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Each matmul boundary masks a different pair of axes</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Illustrative tile width 4; logical M = 3, N = 2, K = 1.</text><text x="132" y="111" font-size="18" fill="#233449" text-anchor="middle" font-weight="600">A load</text><rect x="50" y="135" width="41" height="41" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="93" y="135" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="136" y="135" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="179" y="135" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="50" y="178" width="41" height="41" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="93" y="178" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="136" y="178" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="179" y="178" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="50" y="221" width="41" height="41" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="93" y="221" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="136" y="221" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="179" y="221" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="50" y="264" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="93" y="264" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="136" y="264" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="179" y="264" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><text x="132" y="334" font-size="16" fill="#233449" text-anchor="middle" font-weight="400">row i, inner k</text><text x="386" y="111" font-size="18" fill="#233449" text-anchor="middle" font-weight="600">B load</text><rect x="304" y="135" width="41" height="41" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="347" y="135" width="41" height="41" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="390" y="135" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="433" y="135" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="304" y="178" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="347" y="178" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="390" y="178" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="433" y="178" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="304" y="221" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="347" y="221" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="390" y="221" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="433" y="221" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="304" y="264" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="347" y="264" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="390" y="264" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="433" y="264" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><text x="386" y="334" font-size="16" fill="#233449" text-anchor="middle" font-weight="400">inner k, column j</text><text x="640" y="111" font-size="18" fill="#233449" text-anchor="middle" font-weight="600">C store</text><rect x="558" y="135" width="41" height="41" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="601" y="135" width="41" height="41" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="644" y="135" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="687" y="135" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="558" y="178" width="41" height="41" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="601" y="178" width="41" height="41" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="644" y="178" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="687" y="178" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="558" y="221" width="41" height="41" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="601" y="221" width="41" height="41" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="644" y="221" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="687" y="221" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="558" y="264" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="601" y="264" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="644" y="264" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="687" y="264" width="41" height="41" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><text x="640" y="334" font-size="16" fill="#233449" text-anchor="middle" font-weight="400">row i, column j</text><text x="48" y="374" font-size="16" fill="#233449" text-anchor="start" font-weight="600">i &lt; M and k &lt; K</text><text x="299" y="374" font-size="16" fill="#233449" text-anchor="start" font-weight="600">k &lt; K and j &lt; N</text><text x="555" y="374" font-size="16" fill="#233449" text-anchor="start" font-weight="600">i &lt; M and j &lt; N</text><text x="45" y="417" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Invalid loads → zero</text><text x="297" y="417" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Invalid loads → zero</text><text x="554" y="417" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Invalid stores → skip</text><text x="30" y="465" font-size="17" fill="#596579" text-anchor="start" font-weight="400">Zero-filled K padding contributes nothing to every valid output dot product.</text></g></svg>
