<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" role="img" aria-labelledby="title desc">
<title id="title">Split documents before making overlapping examples</title><desc id="desc">Training documents A and B yield chunks wholly within training; validation documents C and D yield chunks wholly within validation. Each document’s example spans 0–7 and 4–11 overlap, illustrating why splitting chunks afterward could leak text.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="490" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Keep every chunk of a document in the same split</text><rect x="55" y="71" width="319" height="308" rx="5" fill="#fafbfc" stroke="#b7c3cc" /><text x="214" y="106" font-size="17" fill="#243340" text-anchor="middle" font-weight="600">Training documents</text><rect x="75" y="140" width="85" height="44" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="117.5" y="168.0" font-size="16" fill="#243340" text-anchor="middle">Doc A</text><rect x="212" y="130" width="130" height="38" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="277.0" y="155.0" font-size="15" fill="#243340" text-anchor="middle">A: tokens 0–7</text><rect x="212" y="178" width="130" height="38" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="277.0" y="203.0" font-size="15" fill="#243340" text-anchor="middle">A: tokens 4–11</text><path d="M 160 162 L 187 162 L 187 149 L 210 149" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 160 162 L 187 162 L 187 197 L 210 197" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="75" y="256" width="85" height="44" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="117.5" y="284.0" font-size="16" fill="#243340" text-anchor="middle">Doc B</text><rect x="212" y="246" width="130" height="38" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="277.0" y="271.0" font-size="15" fill="#243340" text-anchor="middle">B: tokens 0–7</text><rect x="212" y="294" width="130" height="38" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="277.0" y="319.0" font-size="15" fill="#243340" text-anchor="middle">B: tokens 4–11</text><path d="M 160 278 L 187 278 L 187 265 L 210 265" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 160 278 L 187 278 L 187 313 L 210 313" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="427" y="71" width="319" height="308" rx="5" fill="#fafbfc" stroke="#b7c3cc" /><text x="586" y="106" font-size="17" fill="#243340" text-anchor="middle" font-weight="600">Validation documents</text><rect x="447" y="140" width="85" height="44" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="489.5" y="168.0" font-size="16" fill="#243340" text-anchor="middle">Doc C</text><rect x="584" y="130" width="130" height="38" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="649.0" y="155.0" font-size="15" fill="#243340" text-anchor="middle">C: tokens 0–7</text><rect x="584" y="178" width="130" height="38" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="649.0" y="203.0" font-size="15" fill="#243340" text-anchor="middle">C: tokens 4–11</text><path d="M 532 162 L 559 162 L 559 149 L 582 149" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 532 162 L 559 162 L 559 197 L 582 197" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="447" y="256" width="85" height="44" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="489.5" y="284.0" font-size="16" fill="#243340" text-anchor="middle">Doc D</text><rect x="584" y="246" width="130" height="38" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="649.0" y="271.0" font-size="15" fill="#243340" text-anchor="middle">D: tokens 0–7</text><rect x="584" y="294" width="130" height="38" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="649.0" y="319.0" font-size="15" fill="#243340" text-anchor="middle">D: tokens 4–11</text><path d="M 532 278 L 559 278 L 559 265 L 582 265" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 532 278 L 559 278 L 559 313 L 582 313" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="426" font-size="15" fill="#243340" text-anchor="start">Overlapping spans may exist within a split; they must not cross the split boundary.</text><text x="30" y="461" font-size="16" fill="#5d6b76" text-anchor="start">Split document IDs first, then tokenize and chunk each assigned partition.</text>
</g></svg>
