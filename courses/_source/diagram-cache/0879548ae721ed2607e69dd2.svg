<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" role="img" aria-labelledby="title desc"><title id="title">Preserve state for an empty tile; suppress invalid output rows</title><desc id="desc">On a length-five sequence, the diagonal tile with query and key positions four through seven has only one valid score: query four attending key four. Query positions five through seven are padding and must not store output. Separately, valid query one sees no allowed key in the tile containing keys four through seven: key four is future and the remaining keys are out of range. Skip that row’s update and preserve existing online state, rather than evaluating undefined negative-infinity differences.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="490" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">A padded query row and an empty valid-query tile are different cases</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Illustrative N = 5, tile width = 4. The figure describes masking logic, not a GPU tile choice.</text><text x="40" y="111" font-size="18" fill="#233449" text-anchor="start" font-weight="600">Diagonal tail tile</text><text x="40" y="141" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Queries 4–7; keys 4–7</text><text x="34" y="203" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">4</text><rect x="52" y="177" width="37" height="37" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="92" y="177" width="37" height="37" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="132" y="177" width="37" height="37" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="172" y="177" width="37" height="37" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><text x="34" y="243" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">5</text><rect x="52" y="217" width="37" height="37" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><line x1="61" y1="226" x2="80" y2="245" stroke="#b9c4d0" stroke-width="1.5"/><rect x="92" y="217" width="37" height="37" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><line x1="101" y1="226" x2="120" y2="245" stroke="#b9c4d0" stroke-width="1.5"/><rect x="132" y="217" width="37" height="37" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><line x1="141" y1="226" x2="160" y2="245" stroke="#b9c4d0" stroke-width="1.5"/><rect x="172" y="217" width="37" height="37" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><line x1="181" y1="226" x2="200" y2="245" stroke="#b9c4d0" stroke-width="1.5"/><text x="34" y="283" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">6</text><rect x="52" y="257" width="37" height="37" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><line x1="61" y1="266" x2="80" y2="285" stroke="#b9c4d0" stroke-width="1.5"/><rect x="92" y="257" width="37" height="37" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><line x1="101" y1="266" x2="120" y2="285" stroke="#b9c4d0" stroke-width="1.5"/><rect x="132" y="257" width="37" height="37" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><line x1="141" y1="266" x2="160" y2="285" stroke="#b9c4d0" stroke-width="1.5"/><rect x="172" y="257" width="37" height="37" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><line x1="181" y1="266" x2="200" y2="285" stroke="#b9c4d0" stroke-width="1.5"/><text x="34" y="323" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">7</text><rect x="52" y="297" width="37" height="37" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><line x1="61" y1="306" x2="80" y2="325" stroke="#b9c4d0" stroke-width="1.5"/><rect x="92" y="297" width="37" height="37" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><line x1="101" y1="306" x2="120" y2="325" stroke="#b9c4d0" stroke-width="1.5"/><rect x="132" y="297" width="37" height="37" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><line x1="141" y1="306" x2="160" y2="325" stroke="#b9c4d0" stroke-width="1.5"/><rect x="172" y="297" width="37" height="37" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><line x1="181" y1="306" x2="200" y2="325" stroke="#b9c4d0" stroke-width="1.5"/><text x="69" y="170" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">4</text><text x="109" y="170" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">5</text><text x="149" y="170" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">6</text><text x="189" y="170" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">7</text><text x="40" y="366" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Query 4: one allowed key.</text><text x="40" y="394" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Queries 5–7: padded outputs.</text><text x="40" y="421" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Do not store those rows.</text><text x="365" y="111" font-size="18" fill="#233449" text-anchor="start" font-weight="600">A valid query can see an empty tile</text><text x="365" y="145" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Query i = 1; this key tile contains j = 4…7.</text><rect x="367" y="173" width="398" height="56" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="566.0" y="207.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">No key is both in range and causal</text><line x1="564" y1="237" x2="564" y2="265" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="367" y="277" width="398" height="72" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="566.0" y="307.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Skip this row’s update</text><text x="566.0" y="330.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Keep its previous m, ℓ and a</text><text x="365" y="387" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Do not evaluate −∞ − (−∞).</text><text x="30" y="463" font-size="16" fill="#233449" text-anchor="start" font-weight="400">For a valid row with allowed keys, use the guarded online update; tail stores stay masked.</text></g></svg>
