<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
<title id="title">Four query heads share two KV heads</title><desc id="desc">Query heads zero and one use key/value head zero. Query heads two and three use key/value head one. The query tensor has shape [2,4,8,16], keys and values each have shape [2,2,8,16], and the scores still have shape [2,4,8,8].</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="440" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="32" y="32" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Hq = 4 · Hkv = 2 · two queries per KV head</text><text x="31" y="79" font-size="17" fill="#243340" text-anchor="start">Query heads</text><text x="31" y="236" font-size="17" fill="#243340" text-anchor="start">Shared K/V</text><rect x="183" y="95" width="105" height="51" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="235.5" y="127" font-size="18" fill="#243340" text-anchor="middle">Q0</text><rect x="320" y="95" width="105" height="51" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="372.5" y="127" font-size="18" fill="#243340" text-anchor="middle">Q1</text><rect x="457" y="95" width="105" height="51" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="509.5" y="127" font-size="18" fill="#243340" text-anchor="middle">Q2</text><rect x="594" y="95" width="105" height="51" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="646.5" y="127" font-size="18" fill="#243340" text-anchor="middle">Q3</text><rect x="211" y="227" width="184" height="56" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="303" y="262" font-size="18" fill="#243340" text-anchor="middle">K0 and V0</text><rect x="485" y="227" width="184" height="56" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="577" y="262" font-size="18" fill="#243340" text-anchor="middle">K1 and V1</text><line x1="235.5" y1="146" x2="303" y2="227" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="372.5" y1="146" x2="303" y2="227" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="509.5" y1="146" x2="577" y2="227" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="646.5" y1="146" x2="577" y2="227" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="420" y="195" font-size="15" fill="#5d6b76" text-anchor="middle">arrows mean “uses”</text><text x="65" y="330" font-size="17" fill="#243340" text-anchor="start">Q: [2, 4, 8, 16]</text><text x="390" y="330" font-size="17" fill="#243340" text-anchor="start">K, V: each [2, 2, 8, 16]</text><rect x="63" y="356" width="666" height="57" rx="5" fill="#f6f8fa" stroke="#b7c3cc" /><text x="85" y="390" font-size="17" fill="#243340" text-anchor="start">Scores: [2, 4, 8, 8] — still one score matrix per query head</text>
</g></svg>
