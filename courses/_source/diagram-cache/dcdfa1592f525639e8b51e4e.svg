<svg xmlns="http://www.w3.org/2000/svg" width="800" height="462" viewBox="0 0 800 462" role="img" aria-labelledby="title desc"><title id="title">Fusion avoids materializing full-sized intermediates</title><desc id="desc">The unfused explicit stable expression writes shifted inputs and exponentials between separate operations, in addition to row statistics and output. A fused row kernel reads the input row, computes intermediate values on chip, and writes the normalized row. The diagram intentionally omits small row-statistic arrays from the eager strip.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="462" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Fusion changes where intermediates live</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Idealized dataflow of the explicit stable expression; no speedup is assumed.</text><text x="30" y="111" font-size="18" fill="#233449" text-anchor="start" font-weight="600">Eager composition</text><rect x="30" y="134" width="77" height="60" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="68.5" y="170.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">x</text><line x1="112" y1="164" x2="192" y2="164" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="197" y="134" width="117" height="60" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="255.5" y="170.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">shifted x</text><line x1="319" y1="164" x2="410" y2="164" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="415" y="134" width="129" height="60" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="479.5" y="170.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">exp(x − m)</text><line x1="549" y1="164" x2="658" y2="164" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="663" y="134" width="77" height="60" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="701.5" y="170.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">y</text><text x="30" y="234" font-size="17" fill="#233449" text-anchor="start" font-weight="400">These full-sized arrays are materialized between operations.</text><text x="30" y="277" font-size="18" fill="#233449" text-anchor="start" font-weight="600">Fused row kernel</text><rect x="30" y="303" width="100" height="73" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="80.0" y="334.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">x</text><text x="80.0" y="357.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">global</text><line x1="139" y1="339" x2="194" y2="339" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="205" y="296" width="376" height="86" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="393.0" y="333.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">max → shift → exp → sum → divide</text><text x="393.0" y="356.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">intermediate row values stay on chip</text><line x1="590" y1="339" x2="650" y2="339" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="660" y="303" width="110" height="73" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="715.0" y="334.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">y</text><text x="715.0" y="357.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">global</text><text x="30" y="431" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Ideal fused payload: read MN elements and write MN elements.</text></g></svg>
