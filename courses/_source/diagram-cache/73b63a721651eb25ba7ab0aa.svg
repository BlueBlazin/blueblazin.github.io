<svg xmlns="http://www.w3.org/2000/svg" width="800" height="477" viewBox="0 0 800 477" role="img" aria-labelledby="title desc"><title id="title">Fusion moves a rounding boundary</title><desc id="desc">The fused bias epilogue adds the column bias to the FP32 accumulator and rounds only the final output to FP16. A separate FP16 matmul expression rounds the accumulator first, then adds bias and produces another rounded output. These paths need not match bit-for-bit because their intermediate rounding boundaries differ.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="477" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Bias before the cast and bias after the cast are different operations</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Per-column bias b[j] is broadcast to each output row.</text><rect x="30" y="105" width="208" height="65" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="134.0" y="132.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">FP32 matmul</text><text x="134.0" y="155.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">accumulator</text><line x1="248" y1="137" x2="304" y2="137" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="315" y="105" width="183" height="65" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="406.5" y="132.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Add b[j]</text><text x="406.5" y="155.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">in FP32</text><line x1="508" y1="137" x2="554" y2="137" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="565" y="105" width="205" height="65" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="667.5" y="132.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Cast once</text><text x="667.5" y="155.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">to FP16 output</text><text x="30" y="204" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Fused path</text><rect x="30" y="258" width="208" height="65" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="134.0" y="285.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">FP32 matmul</text><text x="134.0" y="308.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">accumulator</text><line x1="248" y1="290" x2="304" y2="290" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="315" y="258" width="183" height="65" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="406.5" y="285.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Round matmul</text><text x="406.5" y="308.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">to FP16</text><line x1="508" y1="290" x2="554" y2="290" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="565" y="258" width="205" height="65" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="667.5" y="285.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Add bias; round</text><text x="667.5" y="308.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">FP16 output</text><text x="30" y="359" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Separate FP16 expression</text><text x="30" y="412" font-size="17" fill="#233449" text-anchor="start" font-weight="400">The second path has already discarded information before bias is added.</text><text x="30" y="447" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Keep the reference’s bias precision and cast locations explicit.</text></g></svg>
