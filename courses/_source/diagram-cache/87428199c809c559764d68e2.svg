<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
<title id="title">Align inputs and next-token targets</title><desc id="desc">A stream [5,8,3,6] forms inputs [5,8,3] and targets [8,3,6]. Logit row zero predicts token 8, row one predicts token 3, and row two predicts token 6. There are three prediction rows, each with V vocabulary logits.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="440" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Each logit row predicts the next token</text><rect x="192" y="66" width="103" height="43" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="243.5" y="93.5" font-size="16" fill="#243340" text-anchor="middle">5</text><text x="243" y="52" font-size="15" fill="#5d6b76" text-anchor="middle">index 0</text><rect x="320" y="66" width="103" height="43" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="371.5" y="93.5" font-size="16" fill="#243340" text-anchor="middle">8</text><text x="371" y="52" font-size="15" fill="#5d6b76" text-anchor="middle">index 1</text><rect x="448" y="66" width="103" height="43" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="499.5" y="93.5" font-size="16" fill="#243340" text-anchor="middle">3</text><text x="499" y="52" font-size="15" fill="#5d6b76" text-anchor="middle">index 2</text><rect x="576" y="66" width="103" height="43" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="627.5" y="93.5" font-size="16" fill="#243340" text-anchor="middle">6</text><text x="627" y="52" font-size="15" fill="#5d6b76" text-anchor="middle">index 3</text><text x="30" y="93" font-size="16" fill="#243340" text-anchor="start">Token stream</text><rect x="192" y="167" width="103" height="43" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="243.5" y="194.5" font-size="16" fill="#243340" text-anchor="middle">5</text><rect x="192" y="282" width="103" height="43" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="243.5" y="309.5" font-size="16" fill="#243340" text-anchor="middle">8</text><line x1="243" y1="210" x2="243" y2="228" stroke="#b7c3cc" stroke-width="1.5"/><line x1="243" y1="256" x2="243" y2="280" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="243" y="248" font-size="15" fill="#243340" text-anchor="middle">logits[:, 0, :]</text><rect x="320" y="167" width="103" height="43" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="371.5" y="194.5" font-size="16" fill="#243340" text-anchor="middle">8</text><rect x="320" y="282" width="103" height="43" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="371.5" y="309.5" font-size="16" fill="#243340" text-anchor="middle">3</text><line x1="371" y1="210" x2="371" y2="228" stroke="#b7c3cc" stroke-width="1.5"/><line x1="371" y1="256" x2="371" y2="280" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="371" y="248" font-size="15" fill="#243340" text-anchor="middle">logits[:, 1, :]</text><rect x="448" y="167" width="103" height="43" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="499.5" y="194.5" font-size="16" fill="#243340" text-anchor="middle">3</text><rect x="448" y="282" width="103" height="43" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="499.5" y="309.5" font-size="16" fill="#243340" text-anchor="middle">6</text><line x1="499" y1="210" x2="499" y2="228" stroke="#b7c3cc" stroke-width="1.5"/><line x1="499" y1="256" x2="499" y2="280" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="499" y="248" font-size="15" fill="#243340" text-anchor="middle">logits[:, 2, :]</text><text x="30" y="194" font-size="16" fill="#243340" text-anchor="start">Input IDs</text><text x="30" y="309" font-size="16" fill="#243340" text-anchor="start">Target IDs</text><text x="30" y="377" font-size="17" fill="#243340" text-anchor="start">Three input positions → logits [B, 3, V] → three target IDs</text><text x="30" y="410" font-size="15" fill="#5d6b76" text-anchor="start">The final raw token is a target; it is not an extra input position in this example.</text>
</g></svg>
