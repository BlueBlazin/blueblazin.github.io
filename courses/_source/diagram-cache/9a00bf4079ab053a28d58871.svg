<svg xmlns="http://www.w3.org/2000/svg" width="800" height="476" viewBox="0 0 800 476" role="img" aria-labelledby="title desc"><title id="title">The row kernel flattens tokens, not features</title><desc id="desc">Two batches, each with three token rows of four features, reshape into six rows of four features. Row index is batch times three plus token. The same four-element weight vector is used for every row. After normalization, restore the original two-by-three-by-four shape.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="476" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Flatten leading axes; preserve the feature axis</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Illustrative input shape [2, 3, 4] becomes [6, 4] for a row kernel.</text><text x="31" y="104" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Batch 0</text><rect x="33" y="119" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="71" y="119" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="109" y="119" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="147" y="119" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="33" y="157" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="71" y="157" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="109" y="157" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="147" y="157" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="33" y="195" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="71" y="195" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="109" y="195" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="147" y="195" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><line x1="196" y1="175" x2="312" y2="192" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><text x="31" y="260" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Batch 1</text><rect x="33" y="275" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="71" y="275" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="109" y="275" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="147" y="275" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="33" y="313" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="71" y="313" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="109" y="313" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="147" y="313" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="33" y="351" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="71" y="351" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="109" y="351" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="147" y="351" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><line x1="196" y1="331" x2="312" y2="306" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="338" y="136" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="376" y="136" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="414" y="136" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="452" y="136" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="338" y="174" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="376" y="174" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="414" y="174" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="452" y="174" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="338" y="212" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="376" y="212" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="414" y="212" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="452" y="212" width="36" height="36" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="338" y="250" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="376" y="250" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="414" y="250" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="452" y="250" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="338" y="288" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="376" y="288" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="414" y="288" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="452" y="288" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="338" y="326" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="376" y="326" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="414" y="326" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="452" y="326" width="36" height="36" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><text x="328" y="160" font-size="15" fill="#596579" text-anchor="end" font-weight="400">0</text><text x="328" y="198" font-size="15" fill="#596579" text-anchor="end" font-weight="400">1</text><text x="328" y="236" font-size="15" fill="#596579" text-anchor="end" font-weight="400">2</text><text x="328" y="274" font-size="15" fill="#596579" text-anchor="end" font-weight="400">3</text><text x="328" y="312" font-size="15" fill="#596579" text-anchor="end" font-weight="400">4</text><text x="328" y="350" font-size="15" fill="#596579" text-anchor="end" font-weight="400">5</text><text x="607" y="171" font-size="16" fill="#233449" text-anchor="middle" font-weight="400">row = batch × 3 + token</text><text x="607" y="209" font-size="16" fill="#233449" text-anchor="middle" font-weight="400">Same 4 feature weights</text><text x="607" y="237" font-size="16" fill="#233449" text-anchor="middle" font-weight="400">for every row</text><rect x="504" y="284" width="264" height="74" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="636.0" y="315.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Apply checked row RMSNorm</text><text x="636.0" y="338.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">then restore [2, 3, 4]</text><text x="30" y="448" font-size="16" fill="#233449" text-anchor="start" font-weight="400">The feature width is unchanged; preserve the incoming epsilon and dtype contract.</text></g></svg>
