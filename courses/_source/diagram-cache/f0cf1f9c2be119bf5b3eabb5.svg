<svg xmlns="http://www.w3.org/2000/svg" width="800" height="405" viewBox="0 0 800 405" role="img" aria-labelledby="title desc">
<title id="title">Evidence pointers identify a version, not just a line number</title>
<desc id="desc">A compact record points to settings.py at snapshot A, lines 12 through 14. The original snapshot supports the recorded observation. After an edit, snapshot B can have different content at the same line numbers. Comparing the saved version with the current version detects a stale pointer. Preserve the old observation as historical evidence and inspect current contents before treating it as a current fact; do not silently relabel the pointer.</desc>
<rect width="800" height="405" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#263445">
<rect x="56" y="31" width="688" height="73" rx="8" fill="#edf2f8" stroke="#c7d2de" stroke-width="1.5"/>
<text x="400" y="61" font-size="18" fill="#263445" font-weight="600" text-anchor="middle">Saved evidence pointer</text>
<text x="400" y="87" font-size="16" fill="#263445" text-anchor="middle">settings.py · snapshot A · lines 12–14</text>
<path d="M283 109 L215 166" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M517 109 L591 166" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<rect x="40" y="173" width="327" height="155" rx="8" fill="#edf5f4" stroke="#abc9c4" stroke-width="1.5"/>
<text x="61" y="205" font-size="17" fill="#263445" font-weight="600">Snapshot A</text>
<text x="61" y="239" font-size="15" fill="#263445">12–14: original supporting content</text>
<text x="61" y="276" font-size="15" fill="#263445">Matches the saved version.</text>
<text x="61" y="304" font-size="15" fill="#263445">Valid evidence about snapshot A.</text>
<rect x="433" y="173" width="327" height="155" rx="8" fill="#f8fafc" stroke="#c7d2de" stroke-width="1.5"/>
<text x="454" y="205" font-size="17" fill="#263445" font-weight="600">Current snapshot B</text>
<text x="454" y="239" font-size="15" fill="#263445">12–14: content may have changed</text>
<text x="454" y="276" font-size="15" fill="#263445">B differs from the saved version.</text>
<text x="454" y="304" font-size="15" fill="#263445">Mark stale; inspect before relying.</text>
<text x="400" y="374" font-size="16" fill="#263445" text-anchor="middle">Same path and line range do not imply the same evidence after an edit.</text>
</g>
</svg>
