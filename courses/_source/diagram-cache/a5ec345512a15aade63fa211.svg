<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
<title id="title">RMSNorm shares gains, not token statistics</title><desc id="desc">Three token rows each contain four channels. Each row has its own mean-square statistic and denominator. The same learned four-channel gain vector is broadcast to all rows; no token contributes to another token’s denominator.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="440" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Normalize each token independently over channels</text><text x="195" y="68" font-size="16" fill="#243340" text-anchor="start">Channel axis D →</text><text x="31" y="113" font-size="16" fill="#243340" text-anchor="start">Token 0</text><rect x="185" y="82" width="51" height="48" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="210.5" y="112.0" font-size="16" fill="#243340" text-anchor="middle">x00</text><rect x="243" y="82" width="51" height="48" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="268.5" y="112.0" font-size="16" fill="#243340" text-anchor="middle">x01</text><rect x="301" y="82" width="51" height="48" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="326.5" y="112.0" font-size="16" fill="#243340" text-anchor="middle">x02</text><rect x="359" y="82" width="51" height="48" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="384.5" y="112.0" font-size="16" fill="#243340" text-anchor="middle">x03</text><line x1="421" y1="106" x2="473" y2="106" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="487" y="80" width="269" height="52" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="621.5" y="100.5" font-size="15" fill="#243340" text-anchor="middle">RMS of row 0 only</text><text x="621.5" y="123.5" font-size="15" fill="#243340" text-anchor="middle">divide row, then multiply gain g</text><text x="31" y="181" font-size="16" fill="#243340" text-anchor="start">Token 1</text><rect x="185" y="150" width="51" height="48" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="210.5" y="180.0" font-size="16" fill="#243340" text-anchor="middle">x10</text><rect x="243" y="150" width="51" height="48" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="268.5" y="180.0" font-size="16" fill="#243340" text-anchor="middle">x11</text><rect x="301" y="150" width="51" height="48" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="326.5" y="180.0" font-size="16" fill="#243340" text-anchor="middle">x12</text><rect x="359" y="150" width="51" height="48" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="384.5" y="180.0" font-size="16" fill="#243340" text-anchor="middle">x13</text><line x1="421" y1="174" x2="473" y2="174" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="487" y="148" width="269" height="52" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="621.5" y="168.5" font-size="15" fill="#243340" text-anchor="middle">RMS of row 1 only</text><text x="621.5" y="191.5" font-size="15" fill="#243340" text-anchor="middle">divide row, then multiply gain g</text><text x="31" y="249" font-size="16" fill="#243340" text-anchor="start">Token 2</text><rect x="185" y="218" width="51" height="48" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="210.5" y="248.0" font-size="16" fill="#243340" text-anchor="middle">x20</text><rect x="243" y="218" width="51" height="48" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="268.5" y="248.0" font-size="16" fill="#243340" text-anchor="middle">x21</text><rect x="301" y="218" width="51" height="48" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="326.5" y="248.0" font-size="16" fill="#243340" text-anchor="middle">x22</text><rect x="359" y="218" width="51" height="48" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="384.5" y="248.0" font-size="16" fill="#243340" text-anchor="middle">x23</text><line x1="421" y1="242" x2="473" y2="242" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="487" y="216" width="269" height="52" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="621.5" y="236.5" font-size="15" fill="#243340" text-anchor="middle">RMS of row 2 only</text><text x="621.5" y="259.5" font-size="15" fill="#243340" text-anchor="middle">divide row, then multiply gain g</text><text x="31" y="337" font-size="17" fill="#243340" text-anchor="start">No reduction over batch or token axes.</text><text x="31" y="375" font-size="17" fill="#243340" text-anchor="start">The same learned gain g[D] scales channels in every row.</text><text x="31" y="407" font-size="16" fill="#5d6b76" text-anchor="start">No mean subtraction; epsilon is inside the square root.</text>
</g></svg>
