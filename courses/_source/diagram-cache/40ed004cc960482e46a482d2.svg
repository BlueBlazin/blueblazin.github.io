<svg xmlns="http://www.w3.org/2000/svg" width="800" height="481" viewBox="0 0 800 481" role="img" aria-labelledby="title desc">
<title id="title">Append new state; preserve the prefix</title><desc id="desc">After a three-token prefill, each layer has keys and values for absolute positions zero, one and two. The next call uses a query at position three and appends K3 and V3, making a cache of length four. The following call appends position four, making length five. Old entries are unchanged. The query at position three can attend to all four stored positions zero through three.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="481" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="32" y="32" font-size="18" fill="#243340" text-anchor="start" font-weight="600">One layer · both K and V grow along the token axis</text><text x="32" y="132" font-size="16" fill="#243340" text-anchor="start">Prefill</text><text x="236" y="87" font-size="16" fill="#5d6b76" text-anchor="start">[B, Hkv, 3, D]</text><rect x="236" y="102" width="75" height="56" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="273" y="136" font-size="18" fill="#243340" text-anchor="middle">0</text><rect x="319" y="102" width="75" height="56" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="356" y="136" font-size="18" fill="#243340" text-anchor="middle">1</text><rect x="402" y="102" width="75" height="56" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="439" y="136" font-size="18" fill="#243340" text-anchor="middle">2</text><text x="32" y="238" font-size="16" fill="#243340" text-anchor="start">Decode position 3</text><text x="236" y="193" font-size="16" fill="#5d6b76" text-anchor="start">[B, Hkv, 4, D]</text><rect x="236" y="208" width="75" height="56" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="273" y="242" font-size="18" fill="#243340" text-anchor="middle">0</text><rect x="319" y="208" width="75" height="56" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="356" y="242" font-size="18" fill="#243340" text-anchor="middle">1</text><rect x="402" y="208" width="75" height="56" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="439" y="242" font-size="18" fill="#243340" text-anchor="middle">2</text><rect x="485" y="208" width="75" height="56" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="522" y="242" font-size="18" fill="#243340" text-anchor="middle">3</text><text x="522" y="286" font-size="15" fill="#356e64" text-anchor="middle">new</text><text x="32" y="344" font-size="16" fill="#243340" text-anchor="start">Decode position 4</text><text x="236" y="299" font-size="16" fill="#5d6b76" text-anchor="start">[B, Hkv, 5, D]</text><rect x="236" y="314" width="75" height="56" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="273" y="348" font-size="18" fill="#243340" text-anchor="middle">0</text><rect x="319" y="314" width="75" height="56" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="356" y="348" font-size="18" fill="#243340" text-anchor="middle">1</text><rect x="402" y="314" width="75" height="56" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="439" y="348" font-size="18" fill="#243340" text-anchor="middle">2</text><rect x="485" y="314" width="75" height="56" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="522" y="348" font-size="18" fill="#243340" text-anchor="middle">3</text><rect x="568" y="314" width="75" height="56" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="605" y="348" font-size="18" fill="#243340" text-anchor="middle">4</text><text x="605" y="392" font-size="15" fill="#356e64" text-anchor="middle">new</text><text x="32" y="425" font-size="16" fill="#5d6b76" text-anchor="start">Each cell denotes that position’s K and V, not one scalar.</text><text x="32" y="454" font-size="16" fill="#5d6b76" text-anchor="start">Rotate each new K once at its absolute position; keep Hkv heads in storage.</text>
</g></svg>
