<svg xmlns="http://www.w3.org/2000/svg" width="800" height="476" viewBox="0 0 800 476" role="img" aria-labelledby="title desc"><title id="title">From CUDA threads to vector elements</title><desc id="desc">With an illustrative block width of four, block zero maps its four threads to indices zero through three, block one to four through seven, and block two to eight through eleven. Each valid thread reads matching input elements and writes its unique output element.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="476" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">A block offset turns thread-local indices into global indices</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Illustrative blockDim.x = 4; the lab uses a larger block.</text><text x="30" y="131" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Block 0</text><rect x="182" y="105" width="121" height="51" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="242.5" y="125.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">thread 0</text><text x="242.5" y="148.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">i = 0</text><rect x="320" y="105" width="121" height="51" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="380.5" y="125.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">thread 1</text><text x="380.5" y="148.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">i = 1</text><rect x="458" y="105" width="121" height="51" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="518.5" y="125.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">thread 2</text><text x="518.5" y="148.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">i = 2</text><rect x="596" y="105" width="121" height="51" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="656.5" y="125.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">thread 3</text><text x="656.5" y="148.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">i = 3</text><text x="757" y="135" font-size="16" fill="#596579" text-anchor="end" font-weight="400">+0</text><text x="30" y="219" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Block 1</text><rect x="182" y="193" width="121" height="51" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="242.5" y="213.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">thread 0</text><text x="242.5" y="236.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">i = 4</text><rect x="320" y="193" width="121" height="51" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="380.5" y="213.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">thread 1</text><text x="380.5" y="236.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">i = 5</text><rect x="458" y="193" width="121" height="51" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="518.5" y="213.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">thread 2</text><text x="518.5" y="236.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">i = 6</text><rect x="596" y="193" width="121" height="51" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="656.5" y="213.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">thread 3</text><text x="656.5" y="236.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">i = 7</text><text x="757" y="223" font-size="16" fill="#596579" text-anchor="end" font-weight="400">+4</text><text x="30" y="307" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Block 2</text><rect x="182" y="281" width="121" height="51" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="242.5" y="301.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">thread 0</text><text x="242.5" y="324.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">i = 8</text><rect x="320" y="281" width="121" height="51" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="380.5" y="301.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">thread 1</text><text x="380.5" y="324.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">i = 9</text><rect x="458" y="281" width="121" height="51" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="518.5" y="301.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">thread 2</text><text x="518.5" y="324.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">i = 10</text><rect x="596" y="281" width="121" height="51" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="656.5" y="301.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">thread 3</text><text x="656.5" y="324.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">i = 11</text><text x="757" y="311" font-size="16" fill="#596579" text-anchor="end" font-weight="400">+8</text><text x="30" y="407" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Each valid thread reads x[i], y[i] and owns the distinct output z[i].</text><text x="30" y="443" font-size="19" fill="#233449" text-anchor="start" font-weight="600">i = blockIdx.x × blockDim.x + threadIdx.x</text></g></svg>
