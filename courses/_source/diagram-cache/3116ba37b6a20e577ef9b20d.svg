<svg xmlns="http://www.w3.org/2000/svg" width="780" height="425" viewBox="0 0 780 425" role="img" aria-labelledby="title desc">
<title id="title">Every task has six planned trials</title>
<desc id="desc">The planned private study has sixteen final tasks, two context conditions, and three repeats per condition. Each task therefore has six distinct trial rows and each repeat has thirty-two rows. The complete manifest has ninety-six unique rows. Each square in this schematic stands for one planned trial, not a success or an observed result. Task rows 3 through 15 are elided. Keep failed, interrupted, and unattempted statuses distinct rather than counting files as completed trials.</desc>
<rect width="780" height="425" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs>
