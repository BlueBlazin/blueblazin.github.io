<svg xmlns="http://www.w3.org/2000/svg" width="800" height="496" viewBox="0 0 800 496" role="img" aria-labelledby="title desc">
<title id="title">Trace the joint latent and the separate positional key</title><desc id="desc">A token h of width d branches to the joint KV latent cKV of width r and a separate rotary positional-key path. Learned up-projections expand the latent to H content-key heads of width dc and H content-value heads of width dv. The positional key of width dp is shared across query heads. A query head uses its own content and rotary query vectors for the two scalar score terms.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="496" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">One token, column-vector convention</text><rect x="31" y="188" width="97" height="50" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="79.5" y="219.0" font-size="17" fill="#243340" text-anchor="middle">h [d]</text><rect x="190" y="78" width="176" height="62" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="278.0" y="103.5" font-size="16" fill="#243340" text-anchor="middle">Down-project KV</text><text x="278.0" y="126.5" font-size="16" fill="#243340" text-anchor="middle">cKV [r]</text><rect x="190" y="262" width="176" height="62" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="278.0" y="287.5" font-size="15" fill="#243340" text-anchor="middle">Positional projection</text><text x="278.0" y="310.5" font-size="15" fill="#243340" text-anchor="middle">then RoPE</text><path d="M 128 213 L 158 213 L 158 109 L 188 109" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 128 213 L 158 213 L 158 293 L 188 293" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="455" y="51" width="285" height="66" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="597.5" y="78.5" font-size="16" fill="#243340" text-anchor="middle">WUK [H·dc, r]</text><text x="597.5" y="101.5" font-size="16" fill="#243340" text-anchor="middle">content K: H heads × dc</text><rect x="455" y="152" width="285" height="66" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="597.5" y="179.5" font-size="16" fill="#243340" text-anchor="middle">WUV [H·dv, r]</text><text x="597.5" y="202.5" font-size="16" fill="#243340" text-anchor="middle">content V: H heads × dv</text><rect x="455" y="267" width="285" height="56" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="597.5" y="289.5" font-size="16" fill="#243340" text-anchor="middle">positional key kR [dp]</text><text x="597.5" y="312.5" font-size="16" fill="#243340" text-anchor="middle">shared across H query heads</text><path d="M 366 109 L 411 109 L 411 84 L 453 84" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 366 109 L 411 109 L 411 185 L 453 185" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><line x1="366" y1="293" x2="453" y2="293" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="31" y="387" font-size="15" fill="#243340" text-anchor="start">Per head i: qC_i [dc] pairs with kC_i [dc]; qR_i [dp] pairs with shared kR.</text><text x="31" y="426" font-size="16" fill="#243340" text-anchor="start">Per-head score numerator: qC_iᵀ kC_i + qR_iᵀ kR — a scalar.</text><text x="31" y="466" font-size="15" fill="#5d6b76" text-anchor="start">Batch/prefix: prepend [B,T] to activation shapes; weights stay shared.</text>
</g></svg>
