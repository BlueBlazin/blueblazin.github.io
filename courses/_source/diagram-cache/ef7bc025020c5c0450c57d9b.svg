<svg xmlns="http://www.w3.org/2000/svg" width="800" height="491" viewBox="0 0 800 491" role="img" aria-labelledby="title desc"><title id="title">Quadratic scores versus bounded tile workspace</title><desc id="desc">Dense attention may materialize an N by N score matrix. Processing a query block at a time needs one Bq by Bk score tile, a Bq by D weighted accumulator and two Bq-length statistics. Both algorithms still retain Q, K, V and output, each N by D. Other framework and kernel allocations must be counted separately.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="491" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Avoiding dense scores removes one quadratic allocation</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">One head; N tokens, width D. Process one query block at a time.</text><text x="30" y="113" font-size="18" fill="#233449" text-anchor="start" font-weight="600">Dense score workspace</text><rect x="63" y="138" width="223" height="223" rx="2" fill="#f0f2f5" stroke="#b9c4d0"/><text x="173" y="246" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">N × N scores</text><text x="173" y="274" font-size="16" fill="#596579" text-anchor="middle" font-weight="400">quadratic in N</text><text x="354" y="113" font-size="18" fill="#233449" text-anchor="start" font-weight="600">Blockwise working state</text><rect x="359" y="150" width="157" height="107" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="437.5" y="198.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">score tile</text><text x="437.5" y="221.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Bq × Bk</text><rect x="554" y="150" width="209" height="107" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="658.5" y="198.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">weighted accumulator</text><text x="658.5" y="221.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Bq × D</text><rect x="359" y="282" width="404" height="58" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="561.0" y="317.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Two row statistics: m and ℓ, each length Bq</text><rect x="30" y="402" width="740" height="64" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="400.0" y="428.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Both still keep Q, K, V and output: each N × D</text><text x="400.0" y="451.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Fixed tile sizes bound workspace, not total memory</text></g></svg>
