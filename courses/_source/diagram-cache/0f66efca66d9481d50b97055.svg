<svg xmlns="http://www.w3.org/2000/svg" width="800" height="478" viewBox="0 0 800 478" role="img" aria-labelledby="title desc">
<title id="title">Decay every column, correct along the key</title><desc id="desc">The lesson’s two-dimensional state example starts with the identity matrix. Multiplying by alpha one half gives diagonal entries one half. With k=q=[1,0], v=[2,0] and beta one, the prediction at the key is [0.5,0] and the error is [1.5,0]. The outer-product correction has only its first column nonzero. Adding it gives state [[2,0],[0,0.5]], whose readout with q is [2,0].</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="478" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="32" y="32" font-size="18" fill="#243340" text-anchor="start" font-weight="600">S has shape [dv, dk] = [2, 2]</text><text x="32" y="64" font-size="17" fill="#243340" text-anchor="start">k = q = [1, 0]     v = [2, 0]     α = 0.5     β = 1</text><text x="100" y="113" font-size="17" fill="#243340" text-anchor="middle" font-weight="600">Sprev</text><rect x="42" y="128" width="58" height="53" rx="0" fill="#f6f8fa" stroke="#b7c3cc" /><text x="71" y="161" font-size="18" fill="#243340" text-anchor="middle">1</text><rect x="100" y="128" width="58" height="53" rx="0" fill="#f6f8fa" stroke="#b7c3cc" /><text x="129" y="161" font-size="18" fill="#243340" text-anchor="middle">0</text><rect x="42" y="181" width="58" height="53" rx="0" fill="#f6f8fa" stroke="#b7c3cc" /><text x="71" y="214" font-size="18" fill="#243340" text-anchor="middle">0</text><rect x="100" y="181" width="58" height="53" rx="0" fill="#f6f8fa" stroke="#b7c3cc" /><text x="129" y="214" font-size="18" fill="#243340" text-anchor="middle">1</text><text x="302" y="113" font-size="17" fill="#243340" text-anchor="middle" font-weight="600">Sdecay = α Sprev</text><rect x="244" y="128" width="58" height="53" rx="0" fill="#f6f8fa" stroke="#b7c3cc" /><text x="273" y="161" font-size="18" fill="#243340" text-anchor="middle">0.5</text><rect x="302" y="128" width="58" height="53" rx="0" fill="#f6f8fa" stroke="#b7c3cc" /><text x="331" y="161" font-size="18" fill="#243340" text-anchor="middle">0</text><rect x="244" y="181" width="58" height="53" rx="0" fill="#f6f8fa" stroke="#b7c3cc" /><text x="273" y="214" font-size="18" fill="#243340" text-anchor="middle">0</text><rect x="302" y="181" width="58" height="53" rx="0" fill="#f6f8fa" stroke="#b7c3cc" /><text x="331" y="214" font-size="18" fill="#243340" text-anchor="middle">0.5</text><text x="504" y="113" font-size="17" fill="#243340" text-anchor="middle" font-weight="600">β e kᵀ</text><rect x="446" y="128" width="58" height="53" rx="0" fill="#dceee9" stroke="#b7c3cc" /><text x="475" y="161" font-size="18" fill="#243340" text-anchor="middle">1.5</text><rect x="504" y="128" width="58" height="53" rx="0" fill="#f6f8fa" stroke="#b7c3cc" /><text x="533" y="161" font-size="18" fill="#243340" text-anchor="middle">0</text><rect x="446" y="181" width="58" height="53" rx="0" fill="#dceee9" stroke="#b7c3cc" /><text x="475" y="214" font-size="18" fill="#243340" text-anchor="middle">0</text><rect x="504" y="181" width="58" height="53" rx="0" fill="#f6f8fa" stroke="#b7c3cc" /><text x="533" y="214" font-size="18" fill="#243340" text-anchor="middle">0</text><text x="706" y="113" font-size="17" fill="#243340" text-anchor="middle" font-weight="600">Snew</text><rect x="648" y="128" width="58" height="53" rx="0" fill="#dceee9" stroke="#b7c3cc" /><text x="677" y="161" font-size="18" fill="#243340" text-anchor="middle">2</text><rect x="706" y="128" width="58" height="53" rx="0" fill="#f6f8fa" stroke="#b7c3cc" /><text x="735" y="161" font-size="18" fill="#243340" text-anchor="middle">0</text><rect x="648" y="181" width="58" height="53" rx="0" fill="#dceee9" stroke="#b7c3cc" /><text x="677" y="214" font-size="18" fill="#243340" text-anchor="middle">0</text><rect x="706" y="181" width="58" height="53" rx="0" fill="#f6f8fa" stroke="#b7c3cc" /><text x="735" y="214" font-size="18" fill="#243340" text-anchor="middle">0.5</text><line x1="170" y1="181" x2="227" y2="181" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="198" y="164" font-size="15" fill="#243340" text-anchor="middle">× 0.5</text><text x="403" y="192" font-size="25" fill="#243340" text-anchor="middle">+</text><text x="605" y="192" font-size="25" fill="#243340" text-anchor="middle">=</text><text x="32" y="286" font-size="17" fill="#243340" text-anchor="start">Prediction at k:  Sdecay k = [0.5, 0]</text><text x="32" y="317" font-size="17" fill="#243340" text-anchor="start">Error:  e = v − Sdecay k = [1.5, 0]</text><text x="32" y="364" font-size="17" fill="#243340" text-anchor="start">k selects column 1 (index 0), so only that column is corrected.</text><text x="32" y="408" font-size="17" fill="#243340" text-anchor="start" font-weight="600">Read after the update:  Snew q = [2, 0]</text><text x="32" y="448" font-size="16" fill="#5d6b76" text-anchor="start">Column 2 (index 1) keeps its decayed value; state size stays 2 × 2.</text>
</g></svg>
