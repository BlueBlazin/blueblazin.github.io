<svg xmlns="http://www.w3.org/2000/svg" width="800" height="466" viewBox="0 0 800 466" role="img" aria-labelledby="title desc">
<title id="title">The last prompt logit predicts the first completion token</title><desc id="desc">Tokens p0,p1,p2,a0,a1,EOS,PAD have labels −100,−100,−100,a0,a1,EOS,−100 before the model’s internal causal shift. Predictor logit rows 2,3,4 train on a0,a1,EOS respectively. Other shown label targets are ignored.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="466" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Labels stay aligned with token IDs; the loss shifts internally</text><text x="246" y="73" font-size="15" fill="#5d6b76" text-anchor="middle">0</text><rect x="214" y="90" width="66" height="43" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="247.0" y="117.5" font-size="15" fill="#243340" text-anchor="middle">p0</text><rect x="214" y="163" width="66" height="43" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="247.0" y="190.5" font-size="15" fill="#243340" text-anchor="middle">−100</text><text x="323" y="73" font-size="15" fill="#5d6b76" text-anchor="middle">1</text><rect x="291" y="90" width="66" height="43" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="324.0" y="117.5" font-size="15" fill="#243340" text-anchor="middle">p1</text><rect x="291" y="163" width="66" height="43" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="324.0" y="190.5" font-size="15" fill="#243340" text-anchor="middle">−100</text><text x="400" y="73" font-size="15" fill="#5d6b76" text-anchor="middle">2</text><rect x="368" y="90" width="66" height="43" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="401.0" y="117.5" font-size="15" fill="#243340" text-anchor="middle">p2</text><rect x="368" y="163" width="66" height="43" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="401.0" y="190.5" font-size="15" fill="#243340" text-anchor="middle">−100</text><text x="477" y="73" font-size="15" fill="#5d6b76" text-anchor="middle">3</text><rect x="445" y="90" width="66" height="43" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="478.0" y="117.5" font-size="15" fill="#243340" text-anchor="middle">a0</text><rect x="445" y="163" width="66" height="43" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="478.0" y="190.5" font-size="15" fill="#243340" text-anchor="middle">a0</text><text x="554" y="73" font-size="15" fill="#5d6b76" text-anchor="middle">4</text><rect x="522" y="90" width="66" height="43" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="555.0" y="117.5" font-size="15" fill="#243340" text-anchor="middle">a1</text><rect x="522" y="163" width="66" height="43" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="555.0" y="190.5" font-size="15" fill="#243340" text-anchor="middle">a1</text><text x="631" y="73" font-size="15" fill="#5d6b76" text-anchor="middle">5</text><rect x="599" y="90" width="66" height="43" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="632.0" y="117.5" font-size="15" fill="#243340" text-anchor="middle">EOS</text><rect x="599" y="163" width="66" height="43" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="632.0" y="190.5" font-size="15" fill="#243340" text-anchor="middle">EOS</text><text x="708" y="73" font-size="15" fill="#5d6b76" text-anchor="middle">6</text><rect x="676" y="90" width="66" height="43" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="709.0" y="117.5" font-size="15" fill="#243340" text-anchor="middle">PAD</text><rect x="676" y="163" width="66" height="43" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="709.0" y="190.5" font-size="15" fill="#243340" text-anchor="middle">−100</text><text x="30" y="119" font-size="16" fill="#243340" text-anchor="start">Token IDs</text><text x="30" y="191" font-size="16" fill="#243340" text-anchor="start">Labels</text><text x="30" y="282" font-size="16" fill="#243340" text-anchor="start">Predictor logit row</text><rect x="214" y="258" width="66" height="43" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="247.0" y="285.5" font-size="15" fill="#243340" text-anchor="middle">0</text><path d="M 247 256 L 324 207" fill="none" stroke="#b7c3cc" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="291" y="258" width="66" height="43" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="324.0" y="285.5" font-size="15" fill="#243340" text-anchor="middle">1</text><path d="M 324 256 L 401 207" fill="none" stroke="#b7c3cc" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="368" y="258" width="66" height="43" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="401.0" y="285.5" font-size="15" fill="#243340" text-anchor="middle">2</text><path d="M 401 256 L 478 207" fill="none" stroke="#356e64" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="445" y="258" width="66" height="43" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="478.0" y="285.5" font-size="15" fill="#243340" text-anchor="middle">3</text><path d="M 478 256 L 555 207" fill="none" stroke="#356e64" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="522" y="258" width="66" height="43" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="555.0" y="285.5" font-size="15" fill="#243340" text-anchor="middle">4</text><path d="M 555 256 L 632 207" fill="none" stroke="#356e64" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="599" y="258" width="66" height="43" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="632.0" y="285.5" font-size="15" fill="#243340" text-anchor="middle">5</text><path d="M 632 256 L 709 207" fill="none" stroke="#b7c3cc" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="357" font-size="17" fill="#243340" text-anchor="start">Logit row 2 (last prompt token) predicts a0 at label position 3.</text><text x="30" y="393" font-size="15" fill="#243340" text-anchor="start">Rows 2, 3 and 4 train on a0, a1 and EOS; prompt/padding labels are ignored.</text><text x="30" y="432" font-size="16" fill="#5d6b76" text-anchor="start">The attention mask and the loss-label mask are separate contracts.</text>
</g></svg>
