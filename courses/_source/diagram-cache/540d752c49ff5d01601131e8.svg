<svg xmlns="http://www.w3.org/2000/svg" width="780" height="464" viewBox="0 0 780 464" role="img" aria-labelledby="title desc">
<title id="title">Resample paired task clusters, not individual trials</title>
<desc id="desc">A task cluster contains all three recent-history trials and all three compaction trials for one task. Compute each condition mean within a task, then their paired difference. The task-weighted estimate is the mean of the sixteen task differences. For a task-cluster bootstrap, sample sixteen task IDs with replacement and carry every selected task’s six records together, including both conditions. Repeatedly sampled tasks repeat their whole cluster. This schematic shows one generic task cluster and three illustrative sampled IDs followed by an ellipsis; there are no measured results.</desc>
<rect width="780" height="464" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#263445">
<text x="24" y="30" font-size="18" fill="#263445" font-weight="600">One task cluster</text>
<rect x="24" y="46" width="329" height="183" rx="8" fill="#f8fafc" stroke="#c7d2de" stroke-width="1.5"/>
<text x="45" y="77" font-size="16" fill="#263445" font-weight="600">Task t</text>
<text x="45" y="113" font-size="15" fill="#263445">Recent</text>
<text x="45" y="158" font-size="15" fill="#263445">Compacted</text>
<rect x="145" y="91" width="51" height="31" rx="8" fill="#edf2f8" stroke="#b5c6da" stroke-width="1.5"/>
<text x="170" y="113" font-size="15" fill="#263445" text-anchor="middle">R1</text>
<rect x="145" y="137" width="51" height="31" rx="8" fill="#edf5f4" stroke="#abc9c4" stroke-width="1.5"/>
<text x="170" y="159" font-size="15" fill="#263445" text-anchor="middle">R1</text>
<rect x="207" y="91" width="51" height="31" rx="8" fill="#edf2f8" stroke="#b5c6da" stroke-width="1.5"/>
<text x="232" y="113" font-size="15" fill="#263445" text-anchor="middle">R2</text>
<rect x="207" y="137" width="51" height="31" rx="8" fill="#edf5f4" stroke="#abc9c4" stroke-width="1.5"/>
<text x="232" y="159" font-size="15" fill="#263445" text-anchor="middle">R2</text>
<rect x="269" y="91" width="51" height="31" rx="8" fill="#edf2f8" stroke="#b5c6da" stroke-width="1.5"/>
<text x="294" y="113" font-size="15" fill="#263445" text-anchor="middle">R3</text>
<rect x="269" y="137" width="51" height="31" rx="8" fill="#edf5f4" stroke="#abc9c4" stroke-width="1.5"/>
<text x="294" y="159" font-size="15" fill="#263445" text-anchor="middle">R3</text>
<text x="45" y="205" font-size="15" fill="#263445">Δt = compacted mean − recent mean</text>
<text x="403" y="30" font-size="18" fill="#263445" font-weight="600">One bootstrap sample</text>
<rect x="403" y="46" width="353" height="183" rx="8" fill="#fff" stroke="#c7d2de" stroke-width="1.5"/>
<text x="424" y="77" font-size="15" fill="#263445">Sample 16 task IDs with replacement</text>
<rect x="424" y="96" width="66" height="79" rx="8" fill="#f4f7fa" stroke="#c7d2de" stroke-width="1.5"/>
<text x="457" y="124" font-size="17" fill="#263445" font-weight="600" text-anchor="middle">04</text>
<text x="457" y="153" font-size="14" fill="#263445" text-anchor="middle">6 rows</text>
<rect x="502" y="96" width="66" height="79" rx="8" fill="#f4f7fa" stroke="#c7d2de" stroke-width="1.5"/>
<text x="535" y="124" font-size="17" fill="#263445" font-weight="600" text-anchor="middle">11</text>
<text x="535" y="153" font-size="14" fill="#263445" text-anchor="middle">6 rows</text>
<rect x="580" y="96" width="66" height="79" rx="8" fill="#f4f7fa" stroke="#c7d2de" stroke-width="1.5"/>
<text x="613" y="124" font-size="17" fill="#263445" font-weight="600" text-anchor="middle">04</text>
<text x="613" y="153" font-size="14" fill="#263445" text-anchor="middle">6 rows</text>
<rect x="658" y="96" width="66" height="79" rx="8" fill="#f4f7fa" stroke="#c7d2de" stroke-width="1.5"/>
<text x="691" y="124" font-size="17" fill="#263445" font-weight="600" text-anchor="middle">…</text>
<text x="691" y="153" font-size="14" fill="#263445" text-anchor="middle"></text>
<text x="424" y="203" font-size="15" fill="#263445">Repeat IDs with their full cluster</text>
<path d="M357 133 L398 133" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="24" y="260" width="732" height="79" rx="8" fill="#f8fafc" stroke="#c7d2de" stroke-width="1.5"/>
<text x="390" y="290" font-size="16" fill="#263445" font-weight="600" text-anchor="middle">Each sampled ID carries both conditions and all three repeats.</text>
<text x="390" y="316" font-size="15" fill="#263445" text-anchor="middle">Recompute the mean paired difference for that bootstrap sample.</text>
<text x="24" y="378" font-size="16" fill="#263445">Point estimate: mean of the 16 task differences.</text>
<text x="24" y="407" font-size="15" fill="#263445">The grouping preserves pairing; it does not remove dependence between task families.</text>
<text x="24" y="436" font-size="15" fill="#263445">Illustration only. Apply the frozen accounting rule before analyzing incomplete studies.</text>
</g>
</svg>
