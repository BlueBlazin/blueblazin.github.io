<svg xmlns="http://www.w3.org/2000/svg" width="800" height="455" viewBox="0 0 800 455" role="img" aria-labelledby="title desc">
<title id="title">Observe policy activation before the model request</title>
<desc id="desc">This illustrative five-turn trace has proposed input sizes 500, 800, 1100, 1200, and 900 tokens, and selected sizes 500, 800, 650, 700, and 900 tokens. At turns 3 and 4 the proposed input exceeds the shared 1000-token input ceiling; context selection reduces it before dispatch. Every selected input is at or below the ceiling. The numbers are teaching examples, not measured performance and not a comparison between the two policies. The pilot must capture such activation evidence for both conditions.</desc>
<rect width="800" height="455" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#263445">
