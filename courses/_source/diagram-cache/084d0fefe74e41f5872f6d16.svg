<svg xmlns="http://www.w3.org/2000/svg" width="800" height="485" viewBox="0 0 800 485" role="img" aria-labelledby="title desc"><title id="title">Warm the full trajectory, then reset for each repetition</title><desc id="desc">The warm-up and both measured repeats begin with an equivalent four-token prompt cache. Three subsequent model calls grow the cache to five, six and seven entries. Each measured repeat times the same decode-only region after its own reset/prefill. Warm-up must exercise all changing-cache shapes, not just the prefill call.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="485" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Every timed repetition must start from the same cache state</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Illustrative T = 4 cached prompt tokens and S = 3 additional model calls.</text><text x="30" y="142" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Full warm-up</text><rect x="227" y="112" width="132" height="52" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="293.0" y="132.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Reset / prefill</text><text x="293.0" y="155.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">cache = 4</text><rect x="402" y="112" width="112" height="52" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="458.0" y="132.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Call 1</text><text x="458.0" y="155.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">cache → 5</text><line x1="517" y1="138" x2="524" y2="138" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="525" y="112" width="112" height="52" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="581.0" y="132.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Call 2</text><text x="581.0" y="155.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">cache → 6</text><line x1="640" y1="138" x2="647" y2="138" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="648" y="112" width="112" height="52" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="704.0" y="132.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Call 3</text><text x="704.0" y="155.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">cache → 7</text><line x1="365" y1="138" x2="395" y2="138" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><text x="30" y="245" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Measured repeat 1</text><rect x="227" y="215" width="132" height="52" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="293.0" y="235.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Reset / prefill</text><text x="293.0" y="258.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">cache = 4</text><rect x="402" y="215" width="112" height="52" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="458.0" y="235.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Call 1</text><text x="458.0" y="258.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">cache → 5</text><line x1="517" y1="241" x2="524" y2="241" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="525" y="215" width="112" height="52" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="581.0" y="235.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Call 2</text><text x="581.0" y="258.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">cache → 6</text><line x1="640" y1="241" x2="647" y2="241" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="648" y="215" width="112" height="52" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="704.0" y="235.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Call 3</text><text x="704.0" y="258.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">cache → 7</text><line x1="365" y1="241" x2="395" y2="241" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 400 283 L 400 292 L 763 292 L 763 283" fill="none" stroke="#426890" stroke-width="1.5"/><text x="30" y="348" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Measured repeat 2</text><rect x="227" y="318" width="132" height="52" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="293.0" y="338.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Reset / prefill</text><text x="293.0" y="361.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">cache = 4</text><rect x="402" y="318" width="112" height="52" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="458.0" y="338.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Call 1</text><text x="458.0" y="361.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">cache → 5</text><line x1="517" y1="344" x2="524" y2="344" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="525" y="318" width="112" height="52" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="581.0" y="338.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Call 2</text><text x="581.0" y="361.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">cache → 6</text><line x1="640" y1="344" x2="647" y2="344" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="648" y="318" width="112" height="52" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="704.0" y="338.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Call 3</text><text x="704.0" y="361.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">cache → 7</text><line x1="365" y1="344" x2="395" y2="344" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 400 386 L 400 395 L 763 395 L 763 386" fill="none" stroke="#426890" stroke-width="1.5"/><text x="580" y="415" font-size="16" fill="#233449" text-anchor="middle" font-weight="400">Same decode-only timed region for both repeats</text><text x="30" y="458" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Warm every changing-cache shape first; reset state again before each measured repeat.</text></g></svg>
