<svg xmlns="http://www.w3.org/2000/svg" width="800" height="492" viewBox="0 0 800 492" role="img" aria-labelledby="title desc">
<title id="title">Separate retained state from score-time algebra</title><desc id="desc">Content query qC is transformed by the transpose of a head’s content-key up-projection into an r-wide vector. Its dot product with the cached latent equals the original qC dot expanded content key. Separately qR dots the cached rotary positional key. Add these terms and divide by the square root of dc plus dp.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="492" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Score one query head against one cached token</text><rect x="33" y="80" width="284" height="58" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="175.0" y="103.5" font-size="15" fill="#243340" text-anchor="middle">Content query qC [dc]</text><text x="175.0" y="126.5" font-size="15" fill="#243340" text-anchor="middle">transform: q̃ = WUK_iᵀ qC [r]</text><rect x="33" y="206" width="284" height="58" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="175.0" y="229.5" font-size="15" fill="#243340" text-anchor="middle">Positional query qR [dp]</text><text x="175.0" y="252.5" font-size="15" fill="#243340" text-anchor="middle">already rotary-positioned</text><rect x="444" y="80" width="317" height="58" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="602.5" y="103.5" font-size="16" fill="#243340" text-anchor="middle">Retained cKV [r]</text><text x="602.5" y="126.5" font-size="16" fill="#243340" text-anchor="middle">content dot product: q̃ᵀ cKV</text><rect x="444" y="206" width="317" height="58" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="602.5" y="229.5" font-size="16" fill="#243340" text-anchor="middle">Retained kR [dp]</text><text x="602.5" y="252.5" font-size="16" fill="#243340" text-anchor="middle">position dot product: qRᵀ kR</text><line x1="317" y1="109" x2="442" y2="109" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="317" y1="235" x2="442" y2="235" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 603 138 L 785 138 L 785 398 L 393 398 L 393 382" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 603 264 L 603 350 L 544 350" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="217" y="325" width="328" height="55" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="381.0" y="347.0" font-size="16" fill="#243340" text-anchor="middle">Add the two scalar terms</text><text x="381.0" y="370.0" font-size="16" fill="#243340" text-anchor="middle">then divide by √(dc + dp)</text><text x="30" y="423" font-size="16" fill="#243340" text-anchor="start">WUK_i is a learned model parameter, not per-token cache state.</text><text x="30" y="461" font-size="16" fill="#5d6b76" text-anchor="start">Expanded content keys need not be retained to compute this score.</text>
</g></svg>
