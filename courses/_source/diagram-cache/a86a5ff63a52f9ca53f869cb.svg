<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">A tile reuses inputs across several dot products</title><desc id="desc">For A of shape 4 by 6 and B of shape 6 by 5, one program computes C rows zero and one and columns zero through two. The highlighted first K chunk loads a 2 by 2 A tile and a 2 by 3 B tile, adding a 2 by 3 partial product to an FP32 accumulator. Three K chunks cover all six inner-dimension values. Each A value contributes to three output columns, while each B value contributes to two output rows.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="500" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="36" font-size="19" fill="#233449" text-anchor="start" font-weight="600">A: 4 × 6     B: 6 × 5     C: 4 × 5</text><text x="30" y="69" font-size="17" fill="#233449" text-anchor="start" font-weight="400">One program owns C rows 0–1, columns 0–2; it visits K in chunks of 2.</text><text x="37" y="114" font-size="18" fill="#233449" text-anchor="start" font-weight="600">A · first K chunk</text><rect x="37" y="129" width="28" height="28" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="67" y="129" width="28" height="28" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="97" y="129" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="127" y="129" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="157" y="129" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="187" y="129" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="37" y="159" width="28" height="28" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="67" y="159" width="28" height="28" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="97" y="159" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="127" y="159" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="157" y="159" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="187" y="159" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="37" y="189" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="67" y="189" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="97" y="189" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="127" y="189" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="157" y="189" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="187" y="189" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="37" y="219" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="67" y="219" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="97" y="219" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="127" y="219" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="157" y="219" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="187" y="219" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><text x="253" y="204" font-size="26" fill="#233449" text-anchor="middle" font-weight="400">×</text><text x="296" y="114" font-size="18" fill="#233449" text-anchor="start" font-weight="600">B · first K chunk</text><rect x="296" y="129" width="28" height="28" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="326" y="129" width="28" height="28" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="356" y="129" width="28" height="28" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="386" y="129" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="416" y="129" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="296" y="159" width="28" height="28" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="326" y="159" width="28" height="28" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="356" y="159" width="28" height="28" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="386" y="159" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="416" y="159" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="296" y="189" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="326" y="189" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="356" y="189" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="386" y="189" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="416" y="189" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="296" y="219" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="326" y="219" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="356" y="219" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="386" y="219" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="416" y="219" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="296" y="249" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="326" y="249" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="356" y="249" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="386" y="249" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="416" y="249" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="296" y="279" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="326" y="279" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="356" y="279" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="386" y="279" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="416" y="279" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><text x="480" y="204" font-size="26" fill="#233449" text-anchor="middle" font-weight="400">→</text><text x="523" y="114" font-size="18" fill="#233449" text-anchor="start" font-weight="600">FP32 accumulator</text><rect x="523" y="129" width="28" height="28" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="553" y="129" width="28" height="28" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="583" y="129" width="28" height="28" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="613" y="129" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="643" y="129" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="523" y="159" width="28" height="28" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="553" y="159" width="28" height="28" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="583" y="159" width="28" height="28" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="613" y="159" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="643" y="159" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="523" y="189" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="553" y="189" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="583" y="189" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="613" y="189" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="643" y="189" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="523" y="219" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="553" y="219" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="583" y="219" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="613" y="219" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="643" y="219" width="28" height="28" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><text x="37" y="329" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Load 2 × 2 = 4 values</text><text x="296" y="329" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Load 2 × 3 = 6 values</text><text x="523" y="329" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Accumulate 2 × 3 outputs</text><rect x="30" y="356" width="740" height="48" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="400" y="386" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">k = 0, 1   →   k = 2, 3   →   k = 4, 5   →   cast and store once</text><text x="30" y="440" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Within each chunk: reuse every A value across 3 columns and B value across 2 rows.</text><text x="30" y="472" font-size="16" fill="#596579" text-anchor="start" font-weight="400">The other column tile reaches column 5: that lane needs an N-boundary mask.</text></g></svg>
