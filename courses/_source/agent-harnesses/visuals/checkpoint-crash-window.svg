<svg xmlns="http://www.w3.org/2000/svg" width="800" height="478" viewBox="0 0 800 478" role="img" aria-labelledby="title desc">
<title id="title">Separate checkpoint and workspace updates</title>
<desc id="desc">The checkpoint first durably records action intent. The file mutation is a separate operation, followed by verification and a later durable completion checkpoint. A crash before the mutation leaves the old file; a crash after mutation but before completion may leave the new file. In both cases the durable checkpoint can still say started. Atomic checkpoint replacement does not make these separate operations one transaction. The drawing concerns the course process-interruption contract; power-loss durability requires the documented storage assumptions.</desc>
<rect width="800" height="478" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#263445">
<text x="30" y="36" font-size="17" fill="#263445" font-weight="600">Action timeline →</text>
<rect x="220" y="69" width="407" height="286" rx="8" fill="#f8fafc" stroke="#b5c6da" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="424" y="95" font-size="16" fill="#263445" font-weight="600" text-anchor="middle">Checkpoint can still say “started”</text>
<text x="25" y="165" font-size="16" fill="#263445" font-weight="600">Checkpoint</text>
<text x="25" y="283" font-size="16" fill="#263445" font-weight="600">Workspace</text>
<rect x="166" y="133" width="142" height="70" rx="8" fill="#edf2f8" stroke="#c7d2de" stroke-width="1.5"/>
<text x="237" y="160" font-size="16" fill="#263445" font-weight="600" text-anchor="middle">Intent saved</text>
<text x="237" y="184" font-size="15" fill="#263445" text-anchor="middle">started</text>
<rect x="614" y="133" width="164" height="70" rx="8" fill="#edf5f4" stroke="#c7d2de" stroke-width="1.5"/>
<text x="696" y="160" font-size="16" fill="#263445" font-weight="600" text-anchor="middle">Completed</text>
<text x="696" y="184" font-size="15" fill="#263445" text-anchor="middle">saved after checks</text>
<path d="M313 169 L608 169" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="166" y="249" width="192" height="65" rx="8" fill="#fff" stroke="#c7d2de" stroke-width="1.5"/>
<text x="262" y="287" font-size="16" fill="#263445" text-anchor="middle">Before contents</text>
<rect x="439" y="249" width="339" height="65" rx="8" fill="#edf5f4" stroke="#c7d2de" stroke-width="1.5"/>
<text x="608" y="276" font-size="16" fill="#263445" font-weight="600" text-anchor="middle">After contents</text>
<text x="608" y="300" font-size="14" fill="#263445" text-anchor="middle">effect can exist before completion record</text>
<path d="M362 281 L433 281" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="398" y="234" font-size="15" fill="#263445" text-anchor="middle">mutate</text>
<path d="M330 207 L330 244 M330 319 L330 373" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M540 207 L540 244 M540 319 L540 373" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="330" y="397" font-size="15" fill="#263445" text-anchor="middle">Crash before effect</text>
<text x="540" y="419" font-size="15" fill="#263445" text-anchor="middle">Crash after effect</text>
<text x="400" y="456" font-size="15" fill="#263445" text-anchor="middle">Atomic replacement of one checkpoint file is not a transaction with the task file.</text>
</g>
</svg>
