<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" aria-labelledby="title desc">
<title id="title">Preserve the log; select the next model input</title>
<desc id="desc">The complete durable event log stays outside the next model request. A deterministic compaction policy derives a smaller record from older history while preserving the original task and constraints. The next input also contains system instructions, tool schemas, and the newest complete interaction groups, including every result for all calls in a group. The input must fit its ceiling while output space is reserved separately. If required fixed content and the newest group cannot fit, stop explicitly instead of splitting the group. Box sizes are schematic, not token counts.</desc>
<rect width="780" height="470" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#263445">
<text x="24" y="31" font-size="18" fill="#263445" font-weight="600">Full durable history</text>
<text x="385" y="31" font-size="18" fill="#263445" font-weight="600">Next model input: bounded</text>
<rect x="24" y="48" width="256" height="321" rx="8" fill="#f8fafc" stroke="#c7d2de" stroke-width="1.5"/>
<rect x="44" y="73" width="216" height="114" rx="8" fill="#fff" stroke="#c7d2de" stroke-width="1.5"/>
<text x="62" y="101" font-size="16" fill="#263445" font-weight="600">Older groups</text>
<text x="62" y="131" font-size="16" fill="#263445">Earlier evidence</text>
<text x="62" y="160" font-size="16" fill="#263445">Saved in the event log</text>
<rect x="44" y="255" width="216" height="91" rx="8" fill="#edf5f4" stroke="#abc9c4" stroke-width="1.5"/>
<text x="62" y="283" font-size="16" fill="#263445" font-weight="600">Newest group</text>
<text x="62" y="310" font-size="16" fill="#263445">Calls c7, c8</text>
<text x="62" y="333" font-size="16" fill="#263445">Results for c7 and c8</text>
<rect x="385" y="48" width="371" height="321" rx="8" fill="#f8fafc" stroke="#c7d2de" stroke-width="1.5"/>
<rect x="404" y="65" width="332" height="76" rx="8" fill="#fff" stroke="#c7d2de" stroke-width="1.5"/>
<text x="421" y="93" font-size="16" fill="#263445" font-weight="600">Required fixed content</text>
<text x="421" y="119" font-size="15" fill="#263445">System, tools, task and constraints</text>
<rect x="404" y="157" width="332" height="87" rx="8" fill="#edf2f8" stroke="#b5c6da" stroke-width="1.5"/>
<text x="421" y="185" font-size="16" fill="#263445" font-weight="600">Compact record</text>
<text x="421" y="210" font-size="15" fill="#263445">Decisions, evidence, changed files,</text>
<text x="421" y="231" font-size="15" fill="#263445">pending actions; verified vs uncertain</text>
<rect x="404" y="260" width="332" height="86" rx="8" fill="#edf5f4" stroke="#abc9c4" stroke-width="1.5"/>
<text x="421" y="289" font-size="16" fill="#263445" font-weight="600">Recent complete groups</text>
<text x="421" y="315" font-size="15" fill="#263445">Calls and all their results stay together</text>
<text x="421" y="336" font-size="15" fill="#263445">Keep provider continuation blocks</text>
<path d="M280 145 L323 145 L323 201 L400 201" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="318" y="116" font-size="15" fill="#263445" text-anchor="middle">derive</text>
<text x="321" y="136" font-size="15" fill="#263445" text-anchor="middle">(lossy)</text>
<path d="M280 301 L400 301" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="342" y="286" font-size="15" fill="#263445" text-anchor="middle">retain</text>
<rect x="385" y="387" width="371" height="49" rx="8" fill="#fff" stroke="#c7d2de" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="570" y="417" font-size="16" fill="#263445" text-anchor="middle">Output space reserved separately</text>
<text x="24" y="410" font-size="15" fill="#263445">Compaction changes the model view,</text>
<text x="24" y="432" font-size="15" fill="#263445">not the saved evidence.</text>
</g>
</svg>
