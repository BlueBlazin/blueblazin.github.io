<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">Resolved ancestry is different from a text prefix</title>
<desc id="desc">Under /tmp, the workspace /tmp/lab and its sibling /tmp/lab-backup have names sharing a text prefix. A file below /tmp/lab is contained in the workspace; a file below /tmp/lab-backup is not. Resolve paths and compare ancestry rather than accepting a string prefix. This simplified directory tree has no symlinks or concurrent filesystem changes.</desc>
<rect width="760" height="420" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#263445">
<rect x="300" y="32" width="160" height="54" rx="8" fill="#f4f7fa" stroke="#c7d2de" stroke-width="1.5"/>
<text x="380" y="66" font-size="18" fill="#263445" font-weight="600" text-anchor="middle">/tmp</text>
<path d="M350 87 L190 144" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M410 87 L570 144" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70" y="149" width="240" height="65" rx="8" fill="#edf5f4" stroke="#abc9c4" stroke-width="1.5"/>
<text x="190" y="177" font-size="18" fill="#263445" font-weight="600" text-anchor="middle">/tmp/lab</text>
<text x="190" y="201" font-size="15" fill="#263445" text-anchor="middle">Workspace root</text>
<rect x="450" y="149" width="240" height="65" rx="8" fill="#f4f7fa" stroke="#c7d2de" stroke-width="1.5"/>
<text x="570" y="177" font-size="18" fill="#263445" font-weight="600" text-anchor="middle">/tmp/lab-backup</text>
<text x="570" y="201" font-size="15" fill="#263445" text-anchor="middle">Sibling directory</text>
<path d="M190 217 L190 263" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M570 217 L570 263" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70" y="268" width="240" height="62" rx="8" fill="#edf5f4" stroke="#abc9c4" stroke-width="1.5"/>
<text x="190" y="294" font-size="17" fill="#263445" font-weight="600" text-anchor="middle">notes.txt</text>
<text x="190" y="317" font-size="15" fill="#263445" text-anchor="middle">Inside the workspace</text>
<rect x="450" y="268" width="240" height="62" rx="8" fill="#f4f7fa" stroke="#c7d2de" stroke-width="1.5"/>
<text x="570" y="294" font-size="17" fill="#263445" font-weight="600" text-anchor="middle">notes.txt</text>
<text x="570" y="317" font-size="15" fill="#263445" text-anchor="middle">Outside the workspace</text>
<text x="380" y="379" font-size="16" fill="#263445" text-anchor="middle">Both paths begin with the characters “/tmp/lab”. Only one is a descendant.</text>
</g>
</svg>
