<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Padding must be neutral throughout the reduction</title><desc id="desc">A five-value row [1, 2, 0, 3, 1] is loaded into eight logical lanes. The three invalid lanes load negative infinity. Subtracting the maximum of 3 leaves invalid lanes at negative infinity. Their exponentials are zero, so the denominator sums only valid data. The output store remains masked to five lanes.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="440" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Five data values, eight logical lanes</text><text x="30" y="67" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Load invalid lanes as −∞, so their exponentials become zero.</text><text x="30" y="134" font-size="16" fill="#233449" text-anchor="start" font-weight="600">Load</text><rect x="177" y="104" width="65" height="47" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="209.5" y="134" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">1</text><rect x="249" y="104" width="65" height="47" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="281.5" y="134" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">2</text><rect x="321" y="104" width="65" height="47" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="353.5" y="134" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">0</text><rect x="393" y="104" width="65" height="47" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="425.5" y="134" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">3</text><rect x="465" y="104" width="65" height="47" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="497.5" y="134" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">1</text><rect x="537" y="104" width="65" height="47" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="569.5" y="134" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">−∞</text><rect x="609" y="104" width="65" height="47" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="641.5" y="134" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">−∞</text><rect x="681" y="104" width="65" height="47" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="713.5" y="134" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">−∞</text><text x="30" y="211" font-size="16" fill="#233449" text-anchor="start" font-weight="600">Subtract max</text><rect x="177" y="181" width="65" height="47" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="209.5" y="211" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">-2</text><rect x="249" y="181" width="65" height="47" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="281.5" y="211" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">-1</text><rect x="321" y="181" width="65" height="47" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="353.5" y="211" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">-3</text><rect x="393" y="181" width="65" height="47" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="425.5" y="211" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">0</text><rect x="465" y="181" width="65" height="47" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="497.5" y="211" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">-2</text><rect x="537" y="181" width="65" height="47" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="569.5" y="211" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">−∞</text><rect x="609" y="181" width="65" height="47" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="641.5" y="211" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">−∞</text><rect x="681" y="181" width="65" height="47" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="713.5" y="211" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">−∞</text><text x="30" y="288" font-size="16" fill="#233449" text-anchor="start" font-weight="600">Exponentiate</text><rect x="177" y="258" width="65" height="47" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="209.5" y="288" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">e⁻²</text><rect x="249" y="258" width="65" height="47" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="281.5" y="288" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">e⁻¹</text><rect x="321" y="258" width="65" height="47" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="353.5" y="288" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">e⁻³</text><rect x="393" y="258" width="65" height="47" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="425.5" y="288" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">1</text><rect x="465" y="258" width="65" height="47" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="497.5" y="288" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">e⁻²</text><rect x="537" y="258" width="65" height="47" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="569.5" y="288" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">0</text><rect x="609" y="258" width="65" height="47" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="641.5" y="288" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">0</text><rect x="681" y="258" width="65" height="47" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="713.5" y="288" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">0</text><text x="30" y="363" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Maximum = 3</text><text x="260" y="363" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Denominator = 1 + 2e⁻² + e⁻¹ + e⁻³ ≈ 1.6883</text><text x="30" y="406" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Normalize all lanes; store only the five valid output probabilities.</text></g></svg>
