<svg xmlns="http://www.w3.org/2000/svg" width="800" height="503" viewBox="0 0 800 503" role="img" aria-labelledby="title desc"><title id="title">Locate the kernel hook in the actual fixture</title><desc id="desc">The supplied decoder block first applies RMSNorm and causal attention to x, then adds the attention output to the unchanged residual x. It next applies a separate RMSNorm and a linear-GELU-linear MLP to the intermediate h, adding that MLP result to h. Both norms are created with the same norm_factory interface but have separate learned weights.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="503" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">The supplied decoder block has two normalization hooks</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Both hooks receive width and epsilon from the fixture configuration.</text><rect x="30" y="131" width="91" height="53" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="75.5" y="163.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">x</text><rect x="186" y="120" width="210" height="76" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="291.0" y="152.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">RMSNorm</text><text x="291.0" y="175.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">causal attention</text><rect x="470" y="131" width="78" height="53" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="509.0" y="163.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Add</text><rect x="650" y="131" width="115" height="53" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="707.5" y="163.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">h</text><line x1="127" y1="157" x2="180" y2="157" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="402" y1="157" x2="463" y2="157" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="555" y1="157" x2="643" y2="157" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 76 125 L 76 92 L 510 92 L 510 124" fill="none" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="320" width="91" height="53" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="75.5" y="352.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">h</text><rect x="186" y="308" width="210" height="78" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="291.0" y="341.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">RMSNorm</text><text x="291.0" y="364.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">linear → GELU → linear</text><rect x="470" y="320" width="78" height="53" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="509.0" y="352.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Add</text><rect x="650" y="320" width="115" height="53" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="707.5" y="352.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">output</text><line x1="127" y1="346" x2="180" y2="346" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="402" y1="346" x2="463" y2="346" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="555" y1="346" x2="643" y2="346" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 76 314 L 76 281 L 510 281 L 510 313" fill="none" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><text x="30" y="438" font-size="17" fill="#233449" text-anchor="start" font-weight="400">These are distinct learned norm modules made by the same norm_factory.</text><text x="30" y="475" font-size="15" fill="#596579" text-anchor="start" font-weight="400">Outside each block: learned token + position embeddings; final RMSNorm and logit head.</text></g></svg>
