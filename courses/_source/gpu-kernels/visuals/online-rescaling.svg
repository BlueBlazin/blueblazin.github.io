<svg xmlns="http://www.w3.org/2000/svg" width="800" height="476" viewBox="0 0 800 476" role="img" aria-labelledby="title desc"><title id="title">Rescale the old denominator and weighted sum together</title><desc id="desc">Use scores [1, 2, 4], split after the second score, with value vectors [1, 0], [0, 1], and [1, 1]. After the first tile, the running maximum is 2, denominator is 1 plus exp(-1), and weighted accumulator is [exp(-1), 1]. The next tile raises the maximum to 4. Multiplying both old states by exp(-2), then adding the new tile, gives denominator 1.1851 and weighted sum [1.0498, 1.1353]. The final attention output is approximately [0.8858, 0.9580].</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="476" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="36" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Scores [1, 2] then [4]: a late maximum changes the scale</text><text x="30" y="72" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Values: v₀ = [1, 0], v₁ = [0, 1], v₂ = [1, 1]</text><rect x="30" y="105" width="322" height="128" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="50" y="135" font-size="18" fill="#233449" text-anchor="start" font-weight="600">After the first tile</text><text x="50" y="167" font-size="17" fill="#233449" text-anchor="start" font-weight="400">m = 2     ℓ = e⁻¹ + 1 ≈ 1.3679</text><text x="50" y="201" font-size="17" fill="#233449" text-anchor="start" font-weight="400">a = [e⁻¹, 1] ≈ [0.3679, 1]</text><line x1="363" y1="168" x2="413" y2="168" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><text x="389" y="148" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">α</text><rect x="429" y="105" width="341" height="128" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="449" y="135" font-size="18" fill="#233449" text-anchor="start" font-weight="600">New maximum: m = 4</text><text x="449" y="168" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Rescale old state by α = e⁻²</text><text x="449" y="201" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Add new weight e⁴⁻⁴ = 1</text><text x="30" y="279" font-size="19" fill="#233449" text-anchor="start" font-weight="600">ℓ = e⁻³ + e⁻² + 1 ≈ 1.1851</text><text x="30" y="318" font-size="19" fill="#233449" text-anchor="start" font-weight="400">a = [e⁻³ + 1, e⁻² + 1] ≈ [1.0498, 1.1353]</text><rect x="30" y="349" width="740" height="56" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="400" y="384" font-size="20" fill="#233449" text-anchor="middle" font-weight="600">Final output a / ℓ ≈ [0.8858, 0.9580]</text><text x="30" y="448" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Rescale both ℓ and a. Dividing after each tile would require a different recurrence.</text></g></svg>
