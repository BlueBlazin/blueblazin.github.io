xt><text x="313" y="111" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">5</text><text x="349" y="111" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">6</text><text x="385" y="111" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">7</text><text x="222" y="96" font-size="16" fill="#233449" text-anchor="middle" font-weight="400">key position j</text><text x="30" y="281" font-size="16" fill="#233449" text-anchor="start" font-weight="400">query i</text><rect x="258" y="263" width="144" height="144" fill="none" stroke="#426890" stroke-width="3"/><text x="453" y="150" font-size="18" fill="#233449" text-anchor="start" font-weight="600">Highlighted tile: i, j = 4…7</text><text x="453" y="190" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Query 4 allows key 4 only</text><text x="453" y="218" font-size="17" fill="#233449" text-anchor="start" font-weight="400">within this tile.</text><text x="453" y="266" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Query 7 allows keys 4–7</text><text x="453" y="294" font-size="17" fill="#233449" text-anchor="start" font-weight="400">within this tile.</text><rect x="453" y="330" width="22" height="22" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="487" y="348" font-size="16" fill="#233449" text-anchor="start" font-weight="400">allowed</text><rect x="590" y="330" width="22" height="22" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="624" y="348" font-size="16" fill="#233449" text-anchor="start" font-weight="400">masked</text><text x="30" y="449" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Earlier K/V tiles are fully causal for this query block; later tiles can be skipped.</text></g></svg>
