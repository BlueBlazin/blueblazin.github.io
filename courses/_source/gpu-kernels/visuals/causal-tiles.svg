<svg xmlns="http://www.w3.org/2000/svg" width="800" height="476" viewBox="0 0 800 476" role="img" aria-labelledby="title desc"><title id="title">A diagonal attention tile needs an elementwise mask</title><desc id="desc">An eight by eight attention mask uses query positions as rows and key positions as columns. The allowed lower triangle includes the diagonal because key j must be no greater than query i. With block size four, the highlighted bottom-right tile spans positions four through seven. Its first row allows only key four within that tile; its final row allows keys four through seven. All keys zero through three are allowed for this query block.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="476" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="36" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Inside a diagonal tile, causality still depends on positions</text><text x="30" y="71" font-size="17" fill="#233449" text-anchor="start" font-weight="400">N = 8 · query/key block size = 4 · allowed key j ≤ query i</text><text x="98" y="145" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">0</text><rect x="116" y="121" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="152" y="121" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="188" y="121" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="224" y="121" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="260" y="121" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="296" y="121" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="332" y="121" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="368" y="121" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><text x="98" y="181" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">1</text><rect x="116" y="157" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="152" y="157" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="188" y="157" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="224" y="157" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="260" y="157" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="296" y="157" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="332" y="157" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="368" y="157" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><text x="98" y="217" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">2</text><rect x="116" y="193" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="152" y="193" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="188" y="193" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="224" y="193" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="260" y="193" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="296" y="193" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="332" y="193" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="368" y="193" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><text x="98" y="253" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">3</text><rect x="116" y="229" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="152" y="229" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="188" y="229" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="224" y="229" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="260" y="229" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="296" y="229" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="332" y="229" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="368" y="229" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><text x="98" y="289" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">4</text><rect x="116" y="265" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="152" y="265" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="188" y="265" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="224" y="265" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="260" y="265" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="296" y="265" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="332" y="265" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="368" y="265" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><text x="98" y="325" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">5</text><rect x="116" y="301" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="152" y="301" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="188" y="301" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="224" y="301" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="260" y="301" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="296" y="301" width="34" height="34" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="332" y="301" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="368" y="301" width="34" height="34" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><text x="98" y="361" font-size="15" fill="#59657