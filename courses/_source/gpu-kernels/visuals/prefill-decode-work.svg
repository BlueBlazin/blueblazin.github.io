<svg xmlns="http://www.w3.org/2000/svg" width="800" height="502" viewBox="0 0 800 502" role="img" aria-labelledby="title desc"><title id="title">Prefill and cached decode are different workloads</title><desc id="desc">For a four-token prompt, each attention head has four query rows and a four-by-four causal score shape. A subsequent call on one new token forms one query row and appends its K and V to the four-token cache, producing a one-by-five score shape. Query count and cache traffic therefore differ between phases.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="502" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Prefill has many queries; cached decode adds one new query</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Per-head illustration: prompt length T = 4, head width D. Cache includes the current token.</text><text x="34" y="111" font-size="18" fill="#233449" text-anchor="start" font-weight="600">Prefill</text><rect x="35" y="136" width="179" height="125" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="124.5" y="193.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Q</text><text x="124.5" y="216.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">4 × D</text><text x="241" y="207" font-size="25" fill="#233449" text-anchor="middle" font-weight="400">×</text><rect x="267" y="136" width="187" height="125" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="360.5" y="193.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Kᵀ</text><text x="360.5" y="216.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">D × 4</text><line x1="465" y1="199" x2="508" y2="199" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="520" y="136" width="243" height="125" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="641.5" y="193.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Causal score shape</text><text x="641.5" y="216.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">4 × 4</text><text x="34" y="320" font-size="18" fill="#233449" text-anchor="start" font-weight="600">Next cached call</text><rect x="35" y="345" width="179" height="77" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="124.5" y="378.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Q</text><text x="124.5" y="401.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">1 × D</text><text x="241" y="396" font-size="25" fill="#233449" text-anchor="middle" font-weight="400">×</text><rect x="267" y="345" width="187" height="77" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="360.5" y="378.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Kᵀ: old 4 + new 1</text><text x="360.5" y="401.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">D × 5</text><line x1="465" y1="384" x2="508" y2="384" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="520" y="345" width="243" height="77" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="641.5" y="378.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Score shape</text><text x="641.5" y="401.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">1 × 5</text><text x="30" y="474" font-size="16" fill="#233449" text-anchor="start" font-weight="400">The cache stores both K and V. Future decode calls repeat with a longer history.</text></g></svg>
