<svg xmlns="http://www.w3.org/2000/svg" width="800" height="506" viewBox="0 0 800 506" role="img" aria-labelledby="title desc"><title id="title">Reuse and accumulator size grow together</title><desc id="desc">The same sixty-four by sixty-four output uses four thirty-two by thirty-two tiles or two thirty-two by sixty-four tiles. Each first configuration program owns 1,024 FP32 accumulator values; each second configuration program owns 2,048. Increasing output width doubles reuse of each A-tile value across columns, but reduces independent output-program count and increases per-program state.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="506" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">A wider tile trades fewer programs for larger per-program state</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Same 64 × 64 output, same K chunk; compare 32 × 32 and 32 × 64 output tiles.</text><text x="178" y="109" font-size="18" fill="#233449" text-anchor="middle" font-weight="600">32 × 32 tiles</text><rect x="66" y="133" width="109" height="81" rx="2" fill="#e5edf7" stroke="#b9c4d0"/><rect x="178" y="133" width="109" height="81" rx="2" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="66" y="217" width="109" height="81" rx="2" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="178" y="217" width="109" height="81" rx="2" fill="#e5edf7" stroke="#b9c4d0"/><text x="178" y="326" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">4 programs</text><text x="178" y="365" font-size="16" fill="#233449" text-anchor="middle" font-weight="400">1,024 accumulator values</text><text x="178" y="398" font-size="16" fill="#596579" text-anchor="middle" font-weight="400">per program</text><text x="571" y="109" font-size="18" fill="#233449" text-anchor="middle" font-weight="600">32 × 64 tiles</text><rect x="459" y="133" width="221" height="81" rx="2" fill="#e5edf7" stroke="#b9c4d0"/><rect x="459" y="217" width="221" height="81" rx="2" fill="#e1f0ec" stroke="#b9c4d0"/><text x="571" y="326" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">2 programs</text><text x="571" y="365" font-size="16" fill="#233449" text-anchor="middle" font-weight="400">2,048 accumulator values</text><text x="571" y="398" font-size="16" fill="#596579" text-anchor="middle" font-weight="400">per program</text><text x="30" y="450" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Each A-tile value is reused across 32 output columns on the left, 64 on the right.</text><text x="30" y="481" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Larger state may affect resource use; these counts do not measure occupancy.</text></g></svg>
