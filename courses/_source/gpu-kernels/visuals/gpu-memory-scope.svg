<svg xmlns="http://www.w3.org/2000/svg" width="800" height="486" viewBox="0 0 800 486" role="img" aria-labelledby="title desc"><title id="title">Thread, block and grid-visible storage</title><desc id="desc">Two illustrative CUDA blocks each contain two shown threads. Registers are private to each thread, shared memory belongs to one block, and global memory is available across the grid. The picture shows ownership, not the number of resident threads or hardware multiprocessors.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="486" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Memory scope follows the execution hierarchy</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Logical scopes only: a block is not a physical multiprocessor.</text><rect x="30" y="95" width="350" height="246" rx="5" fill="#fafbfc" stroke="#b9c4d0"/><text x="48" y="125" font-size="18" fill="#233449" text-anchor="start" font-weight="600">Block 0</text><rect x="48" y="146" width="148" height="83" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="122.0" y="182.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Thread 0</text><text x="122.0" y="205.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">own registers</text><rect x="213" y="146" width="148" height="83" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="287.0" y="182.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Thread 1</text><text x="287.0" y="205.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">own registers</text><rect x="48" y="259" width="313" height="54" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="204.5" y="292.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Shared memory of this block</text><line x1="120" y1="229" x2="120" y2="257" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="285" y1="229" x2="285" y2="257" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="420" y="95" width="350" height="246" rx="5" fill="#fafbfc" stroke="#b9c4d0"/><text x="438" y="125" font-size="18" fill="#233449" text-anchor="start" font-weight="600">Block 1</text><rect x="438" y="146" width="148" height="83" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="512.0" y="182.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Thread 0</text><text x="512.0" y="205.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">own registers</text><rect x="603" y="146" width="148" height="83" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="677.0" y="182.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Thread 1</text><text x="677.0" y="205.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">own registers</text><rect x="438" y="259" width="313" height="54" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="594.5" y="292.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Shared memory of this block</text><line x1="510" y1="229" x2="510" y2="257" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="675" y1="229" x2="675" y2="257" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="405" width="740" height="53" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="400.0" y="437.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Global device memory: accessible to both blocks</text><line x1="205" y1="342" x2="205" y2="402" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="595" y1="342" x2="595" y2="402" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><text x="400" y="375" font-size="16" fill="#596579" text-anchor="middle" font-weight="400">Global loads / stores</text></g></svg>
