<svg xmlns="http://www.w3.org/2000/svg" width="800" height="447" viewBox="0 0 800 447" role="img" aria-labelledby="title desc">
<title id="title">Match the bias to the intended axis</title><desc id="desc">A two-by-three matrix has rows [2,4,6] and [1,3,5]. A length-three bias [10,20,30] broadcasts identically across both rows: channel j receives b[j] for either row. A [2,1] bias would instead be row-specific.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="447" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">A length-three bias repeats across rows</text><rect x="71" y="108" width="54" height="54" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="98.0" y="141.0" font-size="18" fill="#243340" text-anchor="middle">2</text><rect x="448" y="108" width="54" height="54" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="475.0" y="141.0" font-size="18" fill="#243340" text-anchor="middle">10</text><rect x="131" y="108" width="54" height="54" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="158.0" y="141.0" font-size="18" fill="#243340" text-anchor="middle">4</text><rect x="508" y="108" width="54" height="54" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="535.0" y="141.0" font-size="18" fill="#243340" text-anchor="middle">20</text><rect x="191" y="108" width="54" height="54" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="218.0" y="141.0" font-size="18" fill="#243340" text-anchor="middle">6</text><rect x="568" y="108" width="54" height="54" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="595.0" y="141.0" font-size="18" fill="#243340" text-anchor="middle">30</text><rect x="71" y="169" width="54" height="54" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="98.0" y="202.0" font-size="18" fill="#243340" text-anchor="middle">1</text><rect x="448" y="169" width="54" height="54" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="475.0" y="202.0" font-size="18" fill="#243340" text-anchor="middle">10</text><rect x="131" y="169" width="54" height="54" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="158.0" y="202.0" font-size="18" fill="#243340" text-anchor="middle">3</text><rect x="508" y="169" width="54" height="54" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="535.0" y="202.0" font-size="18" fill="#243340" text-anchor="middle">20</text><rect x="191" y="169" width="54" height="54" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="218.0" y="202.0" font-size="18" fill="#243340" text-anchor="middle">5</text><rect x="568" y="169" width="54" height="54" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="595.0" y="202.0" font-size="18" fill="#243340" text-anchor="middle">30</text><text x="159" y="83" font-size="17" fill="#243340" text-anchor="middle">x [2,3]</text><text x="537" y="83" font-size="17" fill="#243340" text-anchor="middle">b [3] broadcast as [2,3]</text><text x="337" y="174" font-size="29" fill="#243340" text-anchor="middle">+</text><text x="537" y="259" font-size="15" fill="#5d6b76" text-anchor="middle">same bias row in both places</text><text x="30" y="333" font-size="17" fill="#243340" text-anchor="start">Each output column j adds b[j], independently for every row.</text><text x="30" y="377" font-size="16" fill="#5d6b76" text-anchor="start">A bias shaped [2,1] would express a different row-specific operation.</text><text x="30" y="416" font-size="15" fill="#5d6b76" text-anchor="start">Check actual values as well as dimensions; a shape alone does not prove meaning.</text>
</g></svg>
