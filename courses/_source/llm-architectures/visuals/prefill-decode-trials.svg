<svg xmlns="http://www.w3.org/2000/svg" width="800" height="483" viewBox="0 0 800 483" role="img" aria-labelledby="title desc">
<title id="title">Reset the cache between independent timing trials</title><desc id="desc">Two independent trials each begin with the same P-token prompt and an empty cache. Prefill creates P cached positions, then two known decode inputs grow the cache to P+1 and P+2. Trial two restarts rather than continuing from trial one’s final cache.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="483" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Each trial starts with the same prompt and empty cache</text><text x="30" y="140" font-size="16" fill="#243340" text-anchor="start">Trial 1</text><rect x="135" y="112" width="203" height="58" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="236.5" y="135.5" font-size="16" fill="#243340" text-anchor="middle">Prefill prompt</text><text x="236.5" y="158.5" font-size="16" fill="#243340" text-anchor="middle">cache length P</text><rect x="385" y="112" width="149" height="58" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="459.5" y="135.5" font-size="15" fill="#243340" text-anchor="middle">Decode token 1</text><text x="459.5" y="158.5" font-size="15" fill="#243340" text-anchor="middle">length P+1</text><rect x="581" y="112" width="149" height="58" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="655.5" y="135.5" font-size="15" fill="#243340" text-anchor="middle">Decode token 2</text><text x="655.5" y="158.5" font-size="15" fill="#243340" text-anchor="middle">length P+2</text><line x1="338" y1="141" x2="383" y2="141" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="534" y1="141" x2="579" y2="141" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="30" y="278" font-size="16" fill="#243340" text-anchor="start">Trial 2</text><rect x="135" y="250" width="203" height="58" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="236.5" y="273.5" font-size="16" fill="#243340" text-anchor="middle">Prefill prompt</text><text x="236.5" y="296.5" font-size="16" fill="#243340" text-anchor="middle">cache length P</text><rect x="385" y="250" width="149" height="58" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="459.5" y="273.5" font-size="15" fill="#243340" text-anchor="middle">Decode token 1</text><text x="459.5" y="296.5" font-size="15" fill="#243340" text-anchor="middle">length P+1</text><rect x="581" y="250" width="149" height="58" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="655.5" y="273.5" font-size="15" fill="#243340" text-anchor="middle">Decode token 2</text><text x="655.5" y="296.5" font-size="15" fill="#243340" text-anchor="middle">length P+2</text><line x1="338" y1="279" x2="383" y2="279" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="534" y1="279" x2="579" y2="279" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="139" y="215" font-size="15" fill="#5d6b76" text-anchor="start">Reset to empty; reuse the same prompt before the next trial.</text><text x="30" y="371" font-size="17" fill="#243340" text-anchor="start">Measure prefill separately from the fixed-length decode sequence.</text><text x="30" y="414" font-size="15" fill="#243340" text-anchor="start">P, number of decode steps, token inputs and timing boundaries match across variants.</text><text x="30" y="453" font-size="15" fill="#5d6b76" text-anchor="start">Lengths label retained positions after each operation; durations are not to scale.</text>
</g></svg>
