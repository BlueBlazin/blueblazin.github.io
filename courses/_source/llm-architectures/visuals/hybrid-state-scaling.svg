<svg xmlns="http://www.w3.org/2000/svg" width="800" height="507" viewBox="0 0 800 507" role="img" aria-labelledby="title desc">
<title id="title">Only part of the hybrid’s retained state is constant</title><desc id="desc">A line chart shows recurrent matrix storage fixed at 0.125 MiB, attention cache growing at T/2048 MiB, and their sum. At T=512 the total is 0.375 MiB, and at 4096 it is 2.125 MiB. It uses the lesson’s separate FP32 matrix and FP16 cache assumptions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="507" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Hybrid state = fixed matrix state + growing attention cache</text><line x1="130" y1="331.0" x2="688" y2="331.0" stroke="#e5e9ed" stroke-width="1.5"/><text x="115" y="336.0" font-size="15" fill="#5d6b76" text-anchor="end">0</text><line x1="130" y1="234.11111111111111" x2="688" y2="234.11111111111111" stroke="#e5e9ed" stroke-width="1.5"/><text x="115" y="239.11111111111111" font-size="15" fill="#5d6b76" text-anchor="end">1</text><line x1="130" y1="137.22222222222223" x2="688" y2="137.22222222222223" stroke="#e5e9ed" stroke-width="1.5"/><text x="115" y="142.22222222222223" font-size="15" fill="#5d6b76" text-anchor="end">2</text><text x="130.0" y="358" font-size="15" fill="#5d6b76" text-anchor="middle">0</text><text x="199.75" y="358" font-size="15" fill="#5d6b76" text-anchor="middle">512</text><text x="688.0" y="358" font-size="15" fill="#5d6b76" text-anchor="middle">4096</text><line x1="130" y1="331" x2="706" y2="331" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="130" y1="331" x2="130" y2="69" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="47" y="77" font-size="16" fill="#243340" text-anchor="start">MiB</text><text x="410" y="395" font-size="16" fill="#243340" text-anchor="middle">Cached token count T</text><line x1="130" y1="318.8888888888889" x2="688" y2="318.8888888888889" stroke="#365e7e" stroke-width="3"/><line x1="130" y1="331" x2="688" y2="137.22222222222223" stroke="#356e64" stroke-width="3"/><line x1="130" y1="318.8888888888889" x2="688" y2="125.11111111111111" stroke="#243340" stroke-width="3"/><text x="365" y="98" font-size="16" fill="#243340" text-anchor="start">Total: 0.125 + T / 2048 MiB</text><text x="417" y="155" font-size="15" fill="#356e64" text-anchor="start">Attention: T / 2048 MiB</text><text x="414" y="312" font-size="15" fill="#365e7e" text-anchor="start">Recurrent matrices: 0.125 MiB</text><text x="30" y="438" font-size="15" fill="#243340" text-anchor="start">T=512: 0.125 + 0.25 = 0.375 MiB.  T=4096: 0.125 + 2 = 2.125 MiB.</text><text x="30" y="477" font-size="15" fill="#5d6b76" text-anchor="start">Toy dimensions only. Short-convolution state, weights and workspaces are excluded.</text>
</g></svg>
