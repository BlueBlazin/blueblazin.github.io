<svg xmlns="http://www.w3.org/2000/svg" width="800" height="493" viewBox="0 0 800 493" role="img" aria-labelledby="title desc">
<title id="title">Top-2 changes use, not expert storage</title><desc id="desc">A box contains all four expert weight sets. One illustrative token sends work only to experts zero and two, while experts one and three remain stored. The router is additional stored and evaluated computation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="493" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Stored parameters and token-level use are different counts</text><rect x="30" y="72" width="740" height="192" rx="5" fill="#fafbfc" stroke="#b7c3cc" /><text x="50" y="106" font-size="17" fill="#243340" text-anchor="start" font-weight="600">All these weights remain stored</text><rect x="62" y="140" width="151" height="85" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="137.5" y="177.0" font-size="15" fill="#243340" text-anchor="middle">Expert 0</text><text x="137.5" y="200.0" font-size="15" fill="#243340" text-anchor="middle">16 → 32 → 16</text><rect x="238" y="140" width="151" height="85" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="313.5" y="177.0" font-size="15" fill="#243340" text-anchor="middle">Expert 1</text><text x="313.5" y="200.0" font-size="15" fill="#243340" text-anchor="middle">16 → 32 → 16</text><rect x="414" y="140" width="151" height="85" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="489.5" y="177.0" font-size="15" fill="#243340" text-anchor="middle">Expert 2</text><text x="489.5" y="200.0" font-size="15" fill="#243340" text-anchor="middle">16 → 32 → 16</text><rect x="590" y="140" width="151" height="85" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="665.5" y="177.0" font-size="15" fill="#243340" text-anchor="middle">Expert 3</text><text x="665.5" y="200.0" font-size="15" fill="#243340" text-anchor="middle">16 → 32 → 16</text><rect x="310" y="337" width="181" height="49" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="400.5" y="367.5" font-size="16" fill="#243340" text-anchor="middle">One token x [16]</text><path d="M 356 337 L 356 303 L 138 303 L 138 227" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 445 337 L 445 282 L 490 282 L 490 227" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><text x="36" y="428" font-size="16" fill="#243340" text-anchor="start">Example selection: experts 0 and 2. Unselected weights are not removed.</text><text x="36" y="464" font-size="16" fill="#5d6b76" text-anchor="start">The router is also stored and evaluated; its weights must be counted.</text>
</g></svg>
