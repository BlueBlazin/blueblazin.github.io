<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
<title id="title">Read the mask by query row</title><desc id="desc">An eight-by-eight causal attention mask. Rows are query positions i and columns are key positions j, both from zero to seven. Cells on and below the diagonal are allowed because j is at most i. Cells above it are masked. Query row four can use keys zero through four, but cannot use keys five through seven.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="480" fill="white"/>
