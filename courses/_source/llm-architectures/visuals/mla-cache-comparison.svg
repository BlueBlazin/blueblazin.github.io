<svg xmlns="http://www.w3.org/2000/svg" width="800" height="508" viewBox="0 0 800 508" role="img" aria-labelledby="title desc">
<title id="title">Count retained elements before comparing bytes</title><desc id="desc">A horizontal bar chart compares logical inference cache sizes for the lesson’s illustrative configuration. At 2048 tokens GQA uses 16 MiB and compact MLA uses 5 MiB. At 4096 tokens the values double to 32 and 10 MiB. The common horizontal scale starts at zero. B is 1, layers 8, FP16 has two bytes per element, GQA has four KV heads of width 64, and compact MLA retains latent width 128 plus positional-key width 32.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="508" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="32" y="32" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Logical cache storage · MiB</text><line x1="215" y1="76" x2="215" y2="357" stroke="#e3e8ed" stroke-width="1.5"/><text x="215" y="382" font-size="15" fill="#5d6b76" text-anchor="middle">0</text><line x1="343" y1="76" x2="343" y2="357" stroke="#e3e8ed" stroke-width="1.5"/><text x="343" y="382" font-size="15" fill="#5d6b76" text-anchor="middle">8</text><line x1="471" y1="76" x2="471" y2="357" stroke="#e3e8ed" stroke-width="1.5"/><text x="471" y="382" font-size="15" fill="#5d6b76" text-anchor="middle">16</text><line x1="599" y1="76" x2="599" y2="357" stroke="#e3e8ed" stroke-width="1.5"/><text x="599" y="382" font-size="15" fill="#5d6b76" text-anchor="middle">24</text><line x1="727" y1="76" x2="727" y2="357" stroke="#e3e8ed" stroke-width="1.5"/><text x="727" y="382" font-size="15" fill="#5d6b76" text-anchor="middle">32</text><text x="198" y="121" font-size="15" fill="#243340" text-anchor="end">GQA · 2048 tokens</text><rect x="215" y="95" width="256" height="38" rx="0" fill="#dbe7f2" stroke="#b7c3cc" data-mib="16"/><text x="480" y="120" font-size="17" fill="#243340" text-anchor="start">16</text><text x="198" y="183" font-size="15" fill="#243340" text-anchor="end">MLA · 2048 tokens</text><rect x="215" y="157" width="80" height="38" rx="0" fill="#dceee9" stroke="#b7c3cc" data-mib="5"/><text x="304" y="182" font-size="17" fill="#243340" text-anchor="start">5</text><text x="198" y="270" font-size="15" fill="#243340" text-anchor="end">GQA · 4096 tokens</text><rect x="215" y="244" width="512" height="38" rx="0" fill="#dbe7f2" stroke="#b7c3cc" data-mib="32"/><text x="736" y="269" font-size="17" fill="#243340" text-anchor="start">32</text><text x="198" y="332" font-size="15" fill="#243340" text-anchor="end">MLA · 4096 tokens</text><rect x="215" y="306" width="160" height="38" rx="0" fill="#dceee9" stroke="#b7c3cc" data-mib="10"/><text x="384" y="331" font-size="17" fill="#243340" text-anchor="start">10</text><text x="32" y="419" font-size="16" fill="#243340" text-anchor="start">GQA: 2 × 4 × 64 = 512 elements / token / layer</text><text x="32" y="447" font-size="16" fill="#243340" text-anchor="start">Compact MLA: 128 + 32 = 160 elements / token / layer</text><text x="32" y="479" font-size="15" fill="#5d6b76" text-anchor="start">Both use B = 1, L = 8, FP16 (2 bytes); 1 MiB = 2²⁰ bytes.</text>
</g></svg>
