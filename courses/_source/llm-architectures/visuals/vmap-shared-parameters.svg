<svg xmlns="http://www.w3.org/2000/svg" width="800" height="454" viewBox="0 0 800 454" role="img" aria-labelledby="title desc">
<title id="title">Batch examples without copying the parameter argument</title><desc id="desc">Three example rows of x each enter the same scalar function together with a shared parameter vector w. vmap maps axis zero of x while leaving w unmapped. The stacked losses have shape [N]; their mean is scalar and its gradient with respect to w has shape [D].</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="454" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="30" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Map x across rows; keep w shared</text><rect x="29" y="76" width="176" height="60" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="117.0" y="100.5" font-size="16" fill="#243340" text-anchor="middle">w [D]</text><text x="117.0" y="123.5" font-size="16" fill="#243340" text-anchor="middle">in_axes = None</text><rect x="268" y="73" width="159" height="53" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="347.5" y="94.0" font-size="15" fill="#243340" text-anchor="middle">x[0] [D]</text><text x="347.5" y="117.0" font-size="15" fill="#243340" text-anchor="middle">one batch row</text><rect x="495" y="73" width="175" height="53" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="582.5" y="94.0" font-size="15" fill="#243340" text-anchor="middle">f(w, x[0])</text><text x="582.5" y="117.0" font-size="15" fill="#243340" text-anchor="middle">scalar loss</text><line x1="427" y1="100" x2="493" y2="100" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 205 106 L 235 106 L 235 144 L 582 144 L 582 128" fill="none" stroke="#b7c3cc" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="268" y="160" width="159" height="53" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="347.5" y="181.0" font-size="15" fill="#243340" text-anchor="middle">x[1] [D]</text><text x="347.5" y="204.0" font-size="15" fill="#243340" text-anchor="middle">one batch row</text><rect x="495" y="160" width="175" height="53" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="582.5" y="181.0" font-size="15" fill="#243340" text-anchor="middle">f(w, x[1])</text><text x="582.5" y="204.0" font-size="15" fill="#243340" text-anchor="middle">scalar loss</text><line x1="427" y1="187" x2="493" y2="187" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 205 106 L 235 106 L 235 231 L 582 231 L 582 215" fill="none" stroke="#b7c3cc" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="268" y="247" width="159" height="53" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="347.5" y="268.0" font-size="15" fill="#243340" text-anchor="middle">x[2] [D]</text><text x="347.5" y="291.0" font-size="15" fill="#243340" text-anchor="middle">one batch row</text><rect x="495" y="247" width="175" height="53" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="582.5" y="268.0" font-size="15" fill="#243340" text-anchor="middle">f(w, x[2])</text><text x="582.5" y="291.0" font-size="15" fill="#243340" text-anchor="middle">scalar loss</text><line x1="427" y1="274" x2="493" y2="274" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 205 106 L 235 106 L 235 318 L 582 318 L 582 302" fill="none" stroke="#b7c3cc" stroke-width="1.7" marker-end="url(#arrow)"/><text x="268" y="337" font-size="16" fill="#243340" text-anchor="start">x: [N,D], mapped axis 0</text><text x="493" y="337" font-size="16" fill="#243340" text-anchor="start">losses: [N]</text><text x="30" y="385" font-size="17" fill="#243340" text-anchor="start">grad(mean(losses)) has the same [D] shape as w.</text><text x="30" y="421" font-size="16" fill="#5d6b76" text-anchor="start">Equivalently: mean of the per-example gradients, using the same w.</text>
</g></svg>
