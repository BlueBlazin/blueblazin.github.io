<svg xmlns="http://www.w3.org/2000/svg" width="800" height="463" viewBox="0 0 800 463" role="img" aria-labelledby="title desc">
<title id="title">Trace the first gradient through both LoRA factors</title><desc id="desc">For one column-vector example y=sBAx with upstream gradient g, the gradients are s B transpose g x transpose for A and s g (Ax) transpose for B. With B zero, A’s loss gradient is zero. Nonzero A can allow B’s gradient to be nonzero. If both factors are zero, both loss gradients vanish.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="463" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Zero output does not require zero gradients for both factors</text><rect x="31" y="78" width="733" height="55" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="397.5" y="100.0" font-size="17" fill="#243340" text-anchor="middle">Adapter output: y = s B A x     with s = α/r</text><text x="397.5" y="123.0" font-size="17" fill="#243340" text-anchor="middle">Let g = ∂L/∂y be the incoming output gradient.</text><rect x="31" y="177" width="350" height="86" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="206.0" y="214.5" font-size="17" fill="#243340" text-anchor="middle">∂L/∂A = s Bᵀ g xᵀ</text><text x="206.0" y="237.5" font-size="17" fill="#243340" text-anchor="middle">B = 0 ⇒ ∂L/∂A = 0</text><rect x="413" y="177" width="351" height="86" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="588.5" y="214.5" font-size="17" fill="#243340" text-anchor="middle">∂L/∂B = s g (A x)ᵀ</text><text x="588.5" y="237.5" font-size="17" fill="#243340" text-anchor="middle">A ≠ 0 ⇒ gradient can be nonzero</text><text x="31" y="320" font-size="17" fill="#243340" text-anchor="start" font-weight="600">Random A, zero B:</text><text x="258" y="320" font-size="16" fill="#243340" text-anchor="start">B can move first; A can learn after B changes.</text><text x="31" y="369" font-size="17" fill="#243340" text-anchor="start" font-weight="600">Zero A, zero B:</text><text x="258" y="369" font-size="16" fill="#243340" text-anchor="start">both loss-gradient paths are zero initially.</text><text x="31" y="427" font-size="15" fill="#5d6b76" text-anchor="start">“Can be nonzero” depends on x and g; it is not a guarantee for every batch.</text>
</g></svg>
