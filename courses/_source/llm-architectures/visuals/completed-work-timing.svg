<svg xmlns="http://www.w3.org/2000/svg" width="800" height="466" viewBox="0 0 800 466" role="img" aria-labelledby="title desc">
<title id="title">Measure work through device completion</title><desc id="desc">The host warms up outside timing, synchronizes, starts the timer and dispatches device work. The function may return before the device finishes. The timer stops only after a completion wait, so elapsed time includes the whole measured operation rather than just dispatch.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="466" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">A host return is not necessarily completed device work</text><text x="30" y="109" font-size="17" fill="#243340" text-anchor="start">Host</text><text x="30" y="202" font-size="17" fill="#243340" text-anchor="start">Device</text><line x1="145" y1="120" x2="754" y2="120" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="145" y1="220" x2="754" y2="220" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="161" y="79" width="115" height="42" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="218.5" y="106.0" font-size="15" fill="#243340" text-anchor="middle">warm-up</text><rect x="331" y="79" width="94" height="42" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="378.0" y="106.0" font-size="15" fill="#243340" text-anchor="middle">dispatch</text><rect x="503" y="79" width="207" height="42" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="606.5" y="106.0" font-size="15" fill="#243340" text-anchor="middle">wait for completion</text><rect x="331" y="177" width="379" height="43" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="520.5" y="204.5" font-size="16" fill="#243340" text-anchor="middle">measured device work</text><line x1="311" y1="58" x2="311" y2="249" stroke="#5d6b76" stroke-width="1.4" stroke-dasharray="5 4"/><text x="311" y="273" font-size="15" fill="#243340" text-anchor="middle">start</text><line x1="449" y1="58" x2="449" y2="135" stroke="#5d6b76" stroke-width="1.4" stroke-dasharray="5 4"/><text x="449" y="155" font-size="15" fill="#243340" text-anchor="middle">returned</text><line x1="721" y1="58" x2="721" y2="249" stroke="#5d6b76" stroke-width="1.4" stroke-dasharray="5 4"/><text x="721" y="273" font-size="15" fill="#243340" text-anchor="middle">stop</text><line x1="311" y1="310" x2="721" y2="310" stroke="#356e64" stroke-width="3"/><text x="516" y="342" font-size="17" fill="#356e64" text-anchor="middle">Elapsed interval includes completion</text><text x="30" y="397" font-size="15" fill="#243340" text-anchor="start">Synchronize before start and after work; warm-up stays outside this interval.</text><text x="30" y="437" font-size="15" fill="#5d6b76" text-anchor="start">Budget setup and compilation separately even when reporting steady-state speed.</text>
</g></svg>
