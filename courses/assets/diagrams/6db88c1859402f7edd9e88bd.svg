<svg xmlns="http://www.w3.org/2000/svg" width="800" height="502" viewBox="0 0 800 502" role="img" aria-labelledby="title desc"><title id="title">Two tile products have different output shapes</title><desc id="desc">For head dimension thirty-two, a Bq by thirty-two query tile multiplies a transposed K tile to produce Bq by Bk scores. After scaling, masking and exponential weighting, the Bq by Bk weight tile multiplies a Bk by thirty-two V tile to produce a Bq by thirty-two contribution. Each query row has its own FP32 maximum, denominator and weighted accumulator.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="502" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">One attention program owns a query tile and its running state</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Restricted lesson contract: one batch, one head, D = 32; FP32 m, ℓ and a.</text><rect x="30" y="110" width="172" height="65" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="116.0" y="137.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Q tile</text><text x="116.0" y="160.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Bq × 32</text><rect x="251" y="110" width="180" height="65" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="341.0" y="137.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">K tile transposed</text><text x="341.0" y="160.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">32 × Bk</text><text x="226" y="151" font-size="24" fill="#233449" text-anchor="middle" font-weight="400">×</text><line x1="442" y1="143" x2="483" y2="143" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="495" y="110" width="273" height="65" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="631.5" y="137.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Scaled, masked scores</text><text x="631.5" y="160.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Bq × Bk</text><path d="M 634 184 L 634 211 L 115 211 L 115 232" fill="none" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="241" width="172" height="66" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="116.0" y="268.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Weights p</text><text x="116.0" y="291.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Bq × Bk</text><text x="226" y="282" font-size="24" fill="#233449" text-anchor="middle" font-weight="400">×</text><rect x="251" y="241" width="180" height="66" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="341.0" y="268.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">V tile</text><text x="341.0" y="291.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Bk × 32</text><line x1="442" y1="274" x2="483" y2="274" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="495" y="241" width="273" height="66" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="631.5" y="268.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">pV contribution</text><text x="631.5" y="291.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Bq × 32</text><path d="M 634 316 L 634 354" fill="none" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="195" y="363" width="541" height="76" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="465.5" y="395.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Per query row: maximum m, denominator ℓ, accumulator a</text><text x="465.5" y="418.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">a is Bq × 32; divide by ℓ only after the final K/V tile</text><text x="30" y="475" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Q and state persist while successive K/V tiles stream through the program.</text></g></svg>
