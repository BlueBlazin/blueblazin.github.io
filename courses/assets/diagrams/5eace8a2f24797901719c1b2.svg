<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">RMSNorm has two different broadcast axes</title><desc id="desc">A three-row, four-feature input has three row-specific inverse RMS scalars. Each scalar scales one entire row. The same four-feature weight vector is then applied to every row, indexed by column. This separates normalization statistics from shared learned weights.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="450" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">One row statistic; one shared feature-weight vector</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Example M = 3, N = 4. Multiply each row by its own r, then by the same w.</text><rect x="30" y="134" width="45" height="45" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="77" y="134" width="45" height="45" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="124" y="134" width="45" height="45" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="171" y="134" width="45" height="45" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="30" y="181" width="45" height="45" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="77" y="181" width="45" height="45" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="124" y="181" width="45" height="45" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="171" y="181" width="45" height="45" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="30" y="228" width="45" height="45" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="77" y="228" width="45" height="45" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="124" y="228" width="45" height="45" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="171" y="228" width="45" height="45" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><text x="122" y="112" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">x: M × N</text><rect x="277" y="132" width="92" height="139" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="323.0" y="184.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">r₀</text><text x="323.0" y="207.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">r₁</text><text x="323.0" y="230.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">r₂</text><text x="322" y="110" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">r: M × 1</text><rect x="469" y="134" width="55" height="55" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><text x="496.5" y="167.5" font-size="15" fill="#233449" text-anchor="middle" font-weight="400">w0</text><rect x="526" y="134" width="55" height="55" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><text x="553.5" y="167.5" font-size="15" fill="#233449" text-anchor="middle" font-weight="400">w1</text><rect x="583" y="134" width="55" height="55" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><text x="610.5" y="167.5" font-size="15" fill="#233449" text-anchor="middle" font-weight="400">w2</text><rect x="640" y="134" width="55" height="55" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><text x="667.5" y="167.5" font-size="15" fill="#233449" text-anchor="middle" font-weight="400">w3</text><text x="581" y="112" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">w: length N</text><path d="M 473 211 L 473 276 L 688 276 L 688 211" fill="none" stroke="#426890" stroke-width="1.5"/><text x="581" y="244" font-size="16" fill="#233449" text-anchor="middle" font-weight="400">shared across all rows</text><text x="30" y="336" font-size="19" fill="#233449" text-anchor="start" font-weight="600">rᵢ = 1 / √(mean over real features of xᵢ² + ε)</text><text x="30" y="380" font-size="20" fill="#233449" text-anchor="start" font-weight="400">yᵢⱼ = xᵢⱼ × rᵢ × wⱼ</text><text x="30" y="421" font-size="16" fill="#596579" text-anchor="start" font-weight="400">The weight axis is the feature axis; RMSNorm does not subtract a row mean.</text></g></svg>
