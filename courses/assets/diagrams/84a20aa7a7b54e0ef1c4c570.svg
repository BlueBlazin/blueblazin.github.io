<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="title desc">
<title id="title">Keep task execution separate from the host</title>
<desc id="desc">The host harness keeps its model client, API credentials, graders, and reference files. It sends validated commands into a configured task container and receives bounded results. Inside the container, the command accesses only the intended disposable workspace mount. The course configuration removes network access and host sockets, passes a minimal environment, and applies CPU, memory, and process limits. A new process alone would not create these restrictions.</desc>
<rect width="780" height="440" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#263445">
<rect x="24" y="48" width="298" height="333" rx="8" fill="#f8fafc" stroke="#c7d2de" stroke-width="1.5"/>
<rect x="448" y="48" width="308" height="333" rx="8" fill="#f0f7f6" stroke="#abc9c4" stroke-width="1.5"/>
<text x="44" y="80" font-size="18" fill="#263445" font-weight="600">Host</text>
<text x="468" y="80" font-size="18" fill="#263445" font-weight="600">Configured task container</text>
<rect x="44" y="117" width="258" height="84" rx="8" fill="#fff" stroke="#c7d2de" stroke-width="1.5"/>
<text x="64" y="148" font-size="16" fill="#263445" font-weight="600">Harness + model client</text>
<text x="64" y="177" font-size="16" fill="#263445">Validation and dispatch</text>
<rect x="468" y="117" width="268" height="84" rx="8" fill="#fff" stroke="#abc9c4" stroke-width="1.5"/>
<text x="488" y="150" font-size="16" fill="#263445" font-weight="600">Task command</text>
<text x="488" y="178" font-size="16" fill="#263445">Bounded process lifetime</text>
<path d="M305 141 L444 141" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="385" y="128" font-size="15" fill="#263445" text-anchor="middle">command</text>
<path d="M445 186 L307 186" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="385" y="213" font-size="15" fill="#263445" text-anchor="middle">bounded result</text>
<rect x="44" y="274" width="258" height="79" rx="8" fill="#fff" stroke="#c7d2de" stroke-width="1.5"/>
<text x="64" y="304" font-size="16" fill="#263445" font-weight="600">Credentials stay here</text>
<text x="64" y="331" font-size="16" fill="#263445">Graders and reference files</text>
<rect x="468" y="274" width="268" height="79" rx="8" fill="#fff" stroke="#abc9c4" stroke-width="1.5"/>
<text x="488" y="304" font-size="16" fill="#263445" font-weight="600">Task workspace</text>
<text x="488" y="331" font-size="16" fill="#263445">Only intended host mount</text>
<path d="M602 205 L602 269" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="615" y="243" font-size="15" fill="#263445">read / write</text>
<text x="390" y="409" font-size="15" fill="#263445" text-anchor="middle">Container: no network / host sockets · minimal env · CPU, memory, PID limits</text>
</g>
</svg>
