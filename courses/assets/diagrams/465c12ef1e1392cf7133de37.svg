<svg xmlns="http://www.w3.org/2000/svg" width="800" height="474" viewBox="0 0 800 474" role="img" aria-labelledby="title desc">
<title id="title">Broadcast routing weights across output channels</title><desc id="desc">For a token selecting experts zero and two, the dense reference still computes all four D-wide expert outputs. It multiplies them by weights [p0,0,p2,0] broadcast across D, then sums the expert axis. Batched outputs [N,4,D] times weights [N,4,1] reduce to [N,D].</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="474" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Evaluate all experts, then mask and sum the expert axis</text><text x="191" y="76" font-size="16" fill="#243340" text-anchor="start">One token n: slice of outputs [N,4,D]</text><rect x="182" y="99" width="285" height="46" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="324.5" y="128.0" font-size="16" fill="#243340" text-anchor="middle">Expert 0 output: [D]</text><rect x="535" y="99" width="93" height="46" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="581.5" y="128.0" font-size="17" fill="#243340" text-anchor="middle">p0</text><text x="498" y="129" font-size="22" fill="#243340" text-anchor="middle">×</text><rect x="182" y="160" width="285" height="46" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="324.5" y="189.0" font-size="16" fill="#243340" text-anchor="middle">Expert 1 output: [D]</text><rect x="535" y="160" width="93" height="46" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="581.5" y="189.0" font-size="17" fill="#243340" text-anchor="middle">0</text><text x="498" y="190" font-size="22" fill="#243340" text-anchor="middle">×</text><rect x="182" y="221" width="285" height="46" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="324.5" y="250.0" font-size="16" fill="#243340" text-anchor="middle">Expert 2 output: [D]</text><rect x="535" y="221" width="93" height="46" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="581.5" y="250.0" font-size="17" fill="#243340" text-anchor="middle">p2</text><text x="498" y="251" font-size="22" fill="#243340" text-anchor="middle">×</text><rect x="182" y="282" width="285" height="46" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="324.5" y="311.0" font-size="16" fill="#243340" text-anchor="middle">Expert 3 output: [D]</text><rect x="535" y="282" width="93" height="46" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="581.5" y="311.0" font-size="17" fill="#243340" text-anchor="middle">0</text><text x="498" y="312" font-size="22" fill="#243340" text-anchor="middle">×</text><text x="576" y="76" font-size="15" fill="#243340" text-anchor="middle">weights [4,1]</text><path d="M 643 122 L 683 122 L 683 327 L 643 327" fill="none" stroke="#5d6b76" stroke-width="1.7"/><text x="699" y="223" font-size="16" fill="#243340" text-anchor="start">sum</text><text x="699" y="247" font-size="15" fill="#243340" text-anchor="start">experts</text><text x="30" y="401" font-size="17" fill="#243340" text-anchor="start">Batch form: [N,4,D] × [N,4,1] → sum axis 1 → [N,D]</text><text x="30" y="442" font-size="15" fill="#5d6b76" text-anchor="start">The selected weights are scattered into zeros; p0 + p2 = 1 for this token.</text>
</g></svg>
