<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">One partial program still needs a full mask</title><desc id="desc">Two programs of 128 logical lanes cover offsets 0 through 255 for a vector of length 129. Program zero has 128 valid lanes. Program one has only offset 128 valid; offsets 129 through 255 must be masked on both input loads and the output store. Ellipses omit intermediate lane numbers.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="420" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">N = 129 elements · block width = 128 · two programs</text><text x="30" y="70" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Global offset = program ID × 128 + logical lane</text><text x="30" y="150" font-size="16" fill="#233449" text-anchor="start" font-weight="600">Program 0</text><rect x="164" y="122" width="66" height="47" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="197" y="151" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">0</text><rect x="238" y="122" width="66" height="47" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="271" y="151" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">1</text><rect x="312" y="122" width="66" height="47" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="345" y="151" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">2</text><rect x="386" y="122" width="66" height="47" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="419" y="151" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">…</text><rect x="460" y="122" width="66" height="47" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="493" y="151" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">124</text><rect x="534" y="122" width="66" height="47" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="567" y="151" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">125</text><rect x="608" y="122" width="66" height="47" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="641" y="151" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">126</text><rect x="682" y="122" width="66" height="47" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="715" y="151" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">127</text><text x="164" y="196" font-size="16" fill="#596579" text-anchor="start" font-weight="400">All 128 offsets valid</text><text x="30" y="260" font-size="16" fill="#233449" text-anchor="start" font-weight="600">Program 1</text><rect x="164" y="232" width="66" height="47" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="197" y="261" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">128</text><rect x="238" y="232" width="66" height="47" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="271" y="261" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">129</text><rect x="312" y="232" width="66" height="47" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="345" y="261" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">130</text><rect x="386" y="232" width="66" height="47" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="419" y="261" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">…</text><rect x="460" y="232" width="66" height="47" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="493" y="261" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">252</text><rect x="534" y="232" width="66" height="47" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="567" y="261" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">253</text><rect x="608" y="232" width="66" height="47" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="641" y="261" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">254</text><rect x="682" y="232" width="66" height="47" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="715" y="261" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">255</text><text x="164" y="306" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Only offset 128 valid; offsets 129–255 masked</text><text x="30" y="368" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Apply offsets &lt; N to both input loads and the output store.</text><text x="30" y="397" font-size="15" fill="#596579" text-anchor="start" font-weight="400">The ellipsis omits unchanged lanes; boxes are logical lanes, not physical threads.</text></g></svg>
