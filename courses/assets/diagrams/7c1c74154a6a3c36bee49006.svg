<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
<title id="title">Transpose the values, not just the shape label</title><desc id="desc">A PyTorch weight [[1,2,3],[4,5,6]] has shape [2,3] for two outputs and three inputs. The direct x@Wj convention stores [[1,4],[2,5],[3,6]] with shape [3,2]. Both multiply inputs [N,3] to outputs [N,2].</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="440" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="30" font-size="18" fill="#243340" text-anchor="start" font-weight="600">The same six weights, in two storage conventions</text><text x="95" y="81" font-size="17" fill="#243340" text-anchor="start">PyTorch W: [out,in] = [2,3]</text><text x="440" y="81" font-size="17" fill="#243340" text-anchor="start">Direct x @ Wj: Wj [3,2]</text><rect x="118" y="111" width="52" height="52" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="144.0" y="143.0" font-size="18" fill="#243340" text-anchor="middle">1</text><rect x="175" y="111" width="52" height="52" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="201.0" y="143.0" font-size="18" fill="#243340" text-anchor="middle">2</text><rect x="232" y="111" width="52" height="52" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="258.0" y="143.0" font-size="18" fill="#243340" text-anchor="middle">3</text><rect x="118" y="168" width="52" height="52" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="144.0" y="200.0" font-size="18" fill="#243340" text-anchor="middle">4</text><rect x="175" y="168" width="52" height="52" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="201.0" y="200.0" font-size="18" fill="#243340" text-anchor="middle">5</text><rect x="232" y="168" width="52" height="52" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="258.0" y="200.0" font-size="18" fill="#243340" text-anchor="middle">6</text><rect x="482" y="111" width="52" height="52" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="508.0" y="143.0" font-size="18" fill="#243340" text-anchor="middle">1</text><rect x="539" y="111" width="52" height="52" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="565.0" y="143.0" font-size="18" fill="#243340" text-anchor="middle">4</text><rect x="482" y="168" width="52" height="52" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="508.0" y="200.0" font-size="18" fill="#243340" text-anchor="middle">2</text><rect x="539" y="168" width="52" height="52" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="565.0" y="200.0" font-size="18" fill="#243340" text-anchor="middle">5</text><rect x="482" y="225" width="52" height="52" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="508.0" y="257.0" font-size="18" fill="#243340" text-anchor="middle">3</text><rect x="539" y="225" width="52" height="52" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="565.0" y="257.0" font-size="18" fill="#243340" text-anchor="middle">6</text><line x1="323" y1="170" x2="454" y2="170" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><text x="389" y="149" font-size="16" fill="#243340" text-anchor="middle">transpose</text><text x="85" y="325" font-size="17" fill="#243340" text-anchor="start">x [N,3] @ Wᵀ [3,2]</text><text x="438" y="325" font-size="17" fill="#243340" text-anchor="start">x [N,3] @ Wj [3,2]</text><text x="253" y="382" font-size="17" fill="#243340" text-anchor="start">Both produce y [N,2] with the same values.</text><text x="30" y="421" font-size="15" fill="#5d6b76" text-anchor="start">JAX can use either convention; the conversion contract chooses which one.</text>
</g></svg>
