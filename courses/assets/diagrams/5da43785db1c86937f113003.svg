<svg xmlns="http://www.w3.org/2000/svg" width="800" height="506" viewBox="0 0 800 506" role="img" aria-labelledby="title desc"><title id="title">RMSNorm gradients have orthogonal reduction axes</title><desc id="desc">A three-row, four-feature matrix shows two reduction directions. The input-gradient correction computes a scalar from features within each row and broadcasts it only within that row. The weight gradient sums contributions down rows, leaving one value per shared feature weight. The diagram explains dependency axes without carrying out the full derivative algebra.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="506" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Input and shared-weight gradients reduce along different axes</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Illustrative M = 3 rows, D = 4 features. The feature vector w is shared across rows.</text><rect x="75" y="139" width="54" height="54" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="131" y="139" width="54" height="54" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="187" y="139" width="54" height="54" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="243" y="139" width="54" height="54" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="75" y="195" width="54" height="54" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="131" y="195" width="54" height="54" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="187" y="195" width="54" height="54" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="243" y="195" width="54" height="54" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="75" y="251" width="54" height="54" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="131" y="251" width="54" height="54" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="187" y="251" width="54" height="54" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="243" y="251" width="54" height="54" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><text x="185" y="114" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">Row-feature coordinates</text><line x1="305" y1="165" x2="390" y2="165" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="305" y1="221" x2="390" y2="221" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="305" y1="277" x2="390" y2="277" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="406" y="151" width="360" height="132" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="586.0" y="200.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">dx: one correction scalar per row</text><text x="586.0" y="223.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">reduce over features</text><text x="586.0" y="246.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">broadcast back within that row</text><line x1="102" y1="313" x2="102" y2="364" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="158" y1="313" x2="158" y2="364" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="214" y1="313" x2="214" y2="364" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="270" y1="313" x2="270" y2="364" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="75" y="381" width="54" height="54" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="131" y="381" width="54" height="54" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="187" y="381" width="54" height="54" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="243" y="381" width="54" height="54" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><text x="347" y="414" font-size="18" fill="#233449" text-anchor="start" font-weight="400">dw: sum row contributions per feature</text><text x="30" y="478" font-size="17" fill="#596579" text-anchor="start" font-weight="400">A row has its own normalization statistic; all rows contribute to the same w.</text></g></svg>
