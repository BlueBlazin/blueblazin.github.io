<svg xmlns="http://www.w3.org/2000/svg" width="800" height="442" viewBox="0 0 800 442" role="img" aria-labelledby="title desc">
<title id="title">Timeout and confirmed termination are different events</title>
<desc id="desc">This wall-time example has a caller wait ending at its deadline while the configured task execution unit is still being terminated. The runner must stop the promised container or process group, including descendants, and confirm exit. Incremental stdout and stderr readers retain only bounded output and must also finish or be cleaned up. The terminal result follows cleanup, whose duration is reported separately. The output-byte cap is another trigger for the same cleanup path; time positions are schematic.</desc>
<rect width="800" height="442" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#263445">
<text x="30" y="37" font-size="16" fill="#263445" font-weight="600">Schematic time →</text>
<path d="M212 63 L212 357" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="212" y="59" font-size="15" fill="#263445" text-anchor="middle">start</text>
<path d="M443 63 L443 357" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="443" y="59" font-size="15" fill="#263445" text-anchor="middle">deadline</text>
<path d="M691 63 L691 357" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="691" y="59" font-size="15" fill="#263445" text-anchor="middle">exit confirmed</text>
<text x="28" y="117" font-size="16" fill="#263445" font-weight="600">Caller wait</text>
<rect x="212" y="89" width="231" height="47" rx="8" fill="#edf2f8" stroke="#c7d2de" stroke-width="1.5"/>
<text x="327" y="119" font-size="16" fill="#263445" text-anchor="middle">waiting</text>
<text x="28" y="210" font-size="16" fill="#263445" font-weight="600">Execution unit</text>
<text x="28" y="233" font-size="15" fill="#263445">Container or group</text>
<rect x="212" y="183" width="231" height="67" rx="8" fill="#edf5f4" stroke="#c7d2de" stroke-width="1.5"/>
<text x="327" y="214" font-size="16" fill="#263445" text-anchor="middle">task running</text>
<rect x="443" y="183" width="248" height="67" rx="8" fill="#f4f7fa" stroke="#c7d2de" stroke-width="1.5"/>
<text x="567" y="209" font-size="15" fill="#263445" text-anchor="middle">terminate + confirm exit</text>
<text x="567" y="233" font-size="15" fill="#263445" text-anchor="middle">include descendants</text>
<text x="28" y="317" font-size="16" fill="#263445" font-weight="600">Output readers</text>
<rect x="212" y="288" width="479" height="53" rx="8" fill="#edf2f8" stroke="#c7d2de" stroke-width="1.5"/>
<text x="451" y="320" font-size="15" fill="#263445" text-anchor="middle">incremental stdout + stderr; bounded retention</text>
<path d="M443 140 L443 175" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="558" y="161" font-size="15" fill="#263445" text-anchor="middle">timeout triggers cleanup</text>
<path d="M691 344 L691 383" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="691" y="409" font-size="15" fill="#263445" text-anchor="middle">terminal result</text>
<text x="225" y="397" font-size="16" fill="#263445" font-weight="600">Deadline reached ≠ task stopped.</text>
<text x="225" y="425" font-size="15" fill="#263445">Report the cleanup allowance separately.</text>
</g>
</svg>
