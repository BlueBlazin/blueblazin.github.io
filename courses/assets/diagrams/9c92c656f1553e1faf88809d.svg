<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Softmax reductions preserve the row axis</title><desc id="desc">A three-row, four-column input reduces across its columns to one maximum and one exponential denominator per row. Those row statistics are broadcast back across their own four entries to produce output of the same shape. Colored rows remain independent throughout.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="440" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Reduce across features, then broadcast within the same row</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Example M = 3 rows, N = 4 columns; rows are independent.</text><rect x="35" y="118" width="42" height="42" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="79" y="118" width="42" height="42" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="123" y="118" width="42" height="42" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="167" y="118" width="42" height="42" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><line x1="225" y1="139" x2="300" y2="139" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="310" y="115" width="174" height="50" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="397.0" y="146.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">m[0], ℓ[0]</text><line x1="493" y1="139" x2="563" y2="139" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="577" y="118" width="42" height="42" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="621" y="118" width="42" height="42" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="665" y="118" width="42" height="42" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="709" y="118" width="42" height="42" rx="1" fill="#e5edf7" stroke="#b9c4d0"/><rect x="35" y="189" width="42" height="42" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="79" y="189" width="42" height="42" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="123" y="189" width="42" height="42" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="167" y="189" width="42" height="42" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><line x1="225" y1="210" x2="300" y2="210" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="310" y="186" width="174" height="50" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="397.0" y="217.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">m[1], ℓ[1]</text><line x1="493" y1="210" x2="563" y2="210" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="577" y="189" width="42" height="42" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="621" y="189" width="42" height="42" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="665" y="189" width="42" height="42" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="709" y="189" width="42" height="42" rx="1" fill="#e1f0ec" stroke="#b9c4d0"/><rect x="35" y="260" width="42" height="42" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="79" y="260" width="42" height="42" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="123" y="260" width="42" height="42" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="167" y="260" width="42" height="42" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><line x1="225" y1="281" x2="300" y2="281" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="310" y="257" width="174" height="50" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="397.0" y="288.0" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">m[2], ℓ[2]</text><line x1="493" y1="281" x2="563" y2="281" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="577" y="260" width="42" height="42" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="621" y="260" width="42" height="42" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="665" y="260" width="42" height="42" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><rect x="709" y="260" width="42" height="42" rx="1" fill="#f0f2f5" stroke="#b9c4d0"/><text x="113" y="94" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Input: M × N</text><text x="397" y="94" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Two M × 1 statistics</text><text x="665" y="94" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Output: M × N</text><text x="30" y="373" font-size="17" fill="#233449" text-anchor="start" font-weight="400">m is the row maximum. ℓ is the sum of exp(x − m) in that row.</text><text x="30" y="409" font-size="17" fill="#596579" text-anchor="start" font-weight="400">A statistic from one row never normalizes a different row.</text></g></svg>
