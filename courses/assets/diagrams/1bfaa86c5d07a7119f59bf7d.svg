<svg xmlns="http://www.w3.org/2000/svg" width="800" height="483" viewBox="0 0 800 483" role="img" aria-labelledby="title desc">
<title id="title">Compare corresponding boundaries in order</title><desc id="desc">Two framework lanes show embeddings, block-one residual, block-two residual and final logits. A schematic first mismatch at block one narrows inspection to the operations between the matching embeddings and that residual output; later mismatches may be consequences.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="483" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="30" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Find the first divergence, then inspect that interval</text><text x="160" y="76" font-size="18" fill="#243340" text-anchor="middle" font-weight="600">PyTorch</text><text x="623" y="76" font-size="18" fill="#243340" text-anchor="middle" font-weight="600">JAX</text><rect x="55" y="103" width="213" height="45" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="161.5" y="131.5" font-size="16" fill="#243340" text-anchor="middle">Embeddings</text><rect x="516" y="103" width="213" height="45" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="622.5" y="131.5" font-size="16" fill="#243340" text-anchor="middle">Embeddings</text><line x1="272" y1="126" x2="510" y2="126" stroke="#b7c3cc" stroke-width="1.5"/><text x="392" y="120" font-size="15" fill="#243340" text-anchor="middle">match</text><line x1="160" y1="148" x2="160" y2="178" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="623" y1="148" x2="623" y2="178" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="55" y="181" width="213" height="45" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="161.5" y="209.5" font-size="16" fill="#243340" text-anchor="middle">Block 1 residual</text><rect x="516" y="181" width="213" height="45" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="622.5" y="209.5" font-size="16" fill="#243340" text-anchor="middle">Block 1 residual</text><line x1="272" y1="204" x2="510" y2="204" stroke="#b7c3cc" stroke-width="1.5"/><text x="392" y="198" font-size="15" fill="#243340" text-anchor="middle">first mismatch</text><line x1="160" y1="226" x2="160" y2="256" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="623" y1="226" x2="623" y2="256" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="55" y="259" width="213" height="45" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="161.5" y="287.5" font-size="16" fill="#243340" text-anchor="middle">Block 2 residual</text><rect x="516" y="259" width="213" height="45" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="622.5" y="287.5" font-size="16" fill="#243340" text-anchor="middle">Block 2 residual</text><line x1="272" y1="282" x2="510" y2="282" stroke="#b7c3cc" stroke-width="1.5"/><text x="392" y="276" font-size="15" fill="#243340" text-anchor="middle">downstream</text><line x1="160" y1="304" x2="160" y2="334" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="623" y1="304" x2="623" y2="334" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="55" y="337" width="213" height="45" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="161.5" y="365.5" font-size="16" fill="#243340" text-anchor="middle">Final logits</text><rect x="516" y="337" width="213" height="45" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="622.5" y="365.5" font-size="16" fill="#243340" text-anchor="middle">Final logits</text><line x1="272" y1="360" x2="510" y2="360" stroke="#b7c3cc" stroke-width="1.5"/><text x="392" y="354" font-size="15" fill="#243340" text-anchor="middle">downstream</text><text x="30" y="456" font-size="15" fill="#5d6b76" text-anchor="start">Same arrays, tokens, positions, masks and dtype are required before comparison.</text>
</g></svg>
