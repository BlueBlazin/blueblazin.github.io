<svg xmlns="http://www.w3.org/2000/svg" width="800" height="499" viewBox="0 0 800 499" role="img" aria-labelledby="title desc">
<title id="title">Do not confuse cache width with selected history</title><desc id="desc">The left panel keeps all five position rows but represents each with a narrower stored vector. The right panel keeps equal-width rows while reading only positions zero, two and four. These illustrate compression and selection as distinct axes; actual architectures may combine both.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="499" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Compression and position selection answer different questions</text><text x="30" y="79" font-size="17" fill="#243340" text-anchor="start" font-weight="600">Compress stored width</text><text x="425" y="79" font-size="17" fill="#243340" text-anchor="start" font-weight="600">Select which positions to read</text><text x="28" y="129" font-size="15" fill="#5d6b76" text-anchor="start">0</text><rect x="55" y="105" width="136" height="32" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><line x1="198" y1="121" x2="235" y2="121" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="246" y="105" width="49" height="32" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="28" y="175" font-size="15" fill="#5d6b76" text-anchor="start">1</text><rect x="55" y="151" width="136" height="32" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><line x1="198" y1="167" x2="235" y2="167" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="246" y="151" width="49" height="32" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="28" y="221" font-size="15" fill="#5d6b76" text-anchor="start">2</text><rect x="55" y="197" width="136" height="32" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><line x1="198" y1="213" x2="235" y2="213" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="246" y="197" width="49" height="32" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="28" y="267" font-size="15" fill="#5d6b76" text-anchor="start">3</text><rect x="55" y="243" width="136" height="32" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><line x1="198" y1="259" x2="235" y2="259" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="246" y="243" width="49" height="32" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="28" y="313" font-size="15" fill="#5d6b76" text-anchor="start">4</text><rect x="55" y="289" width="136" height="32" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><line x1="198" y1="305" x2="235" y2="305" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="246" y="289" width="49" height="32" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="429" y="129" font-size="15" fill="#5d6b76" text-anchor="start">0</text><rect x="457" y="105" width="164" height="32" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="644" y="128" font-size="15" fill="#356e64" text-anchor="start">read</text><text x="429" y="175" font-size="15" fill="#5d6b76" text-anchor="start">1</text><rect x="457" y="151" width="164" height="32" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="644" y="174" font-size="15" fill="#5d6b76" text-anchor="start">skip</text><text x="429" y="221" font-size="15" fill="#5d6b76" text-anchor="start">2</text><rect x="457" y="197" width="164" height="32" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="644" y="220" font-size="15" fill="#356e64" text-anchor="start">read</text><text x="429" y="267" font-size="15" fill="#5d6b76" text-anchor="start">3</text><rect x="457" y="243" width="164" height="32" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="644" y="266" font-size="15" fill="#5d6b76" text-anchor="start">skip</text><text x="429" y="313" font-size="15" fill="#5d6b76" text-anchor="start">4</text><rect x="457" y="289" width="164" height="32" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="644" y="312" font-size="15" fill="#356e64" text-anchor="start">read</text><text x="30" y="380" font-size="16" fill="#243340" text-anchor="start">Same positions, fewer stored features</text><text x="425" y="380" font-size="16" fill="#243340" text-anchor="start">Same stored width, fewer reads</text><text x="30" y="431" font-size="15" fill="#243340" text-anchor="start">A design can combine both; inspect its actual retained tensors and selection rule.</text><text x="30" y="468" font-size="15" fill="#5d6b76" text-anchor="start">Toy contrasts: these boxes do not specify DeepSeek-V4’s compression or routing.</text>
</g></svg>
