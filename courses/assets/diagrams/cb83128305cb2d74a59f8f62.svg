<svg xmlns="http://www.w3.org/2000/svg" width="800" height="468" viewBox="0 0 800 468" role="img" aria-labelledby="title desc">
<title id="title">Split the generator’s families before drawing rows</title><desc id="desc">A three-by-three grid crosses template-family partitions with entity-family partitions. Only matching train/train, validation/validation and held-out/held-out cells are used. This gives each split exclusive family pools on both axes, unlike deduplicating complete sentences after generation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="468" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Separate both template families and entity families</text><text x="265" y="77" font-size="16" fill="#243340" text-anchor="start">Entity-family partition →</text><text x="311" y="112" font-size="15" fill="#243340" text-anchor="middle">Train entities</text><text x="472" y="112" font-size="15" fill="#243340" text-anchor="middle">Validation entities</text><text x="633" y="112" font-size="15" fill="#243340" text-anchor="middle">Held-out entities</text><text x="30" y="176" font-size="15" fill="#243340" text-anchor="start">Train templates</text><rect x="236" y="137" width="150" height="60" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="311" y="175" font-size="15" fill="#243340" text-anchor="middle">train</text><rect x="397" y="137" width="150" height="60" rx="5" fill="#f6f7f9" stroke="#b7c3cc" /><text x="472" y="175" font-size="15" fill="#5d6b76" text-anchor="middle">not used</text><rect x="558" y="137" width="150" height="60" rx="5" fill="#f6f7f9" stroke="#b7c3cc" /><text x="633" y="175" font-size="15" fill="#5d6b76" text-anchor="middle">not used</text><text x="30" y="248" font-size="15" fill="#243340" text-anchor="start">Validation templates</text><rect x="236" y="209" width="150" height="60" rx="5" fill="#f6f7f9" stroke="#b7c3cc" /><text x="311" y="247" font-size="15" fill="#5d6b76" text-anchor="middle">not used</text><rect x="397" y="209" width="150" height="60" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="472" y="247" font-size="15" fill="#243340" text-anchor="middle">validation</text><rect x="558" y="209" width="150" height="60" rx="5" fill="#f6f7f9" stroke="#b7c3cc" /><text x="633" y="247" font-size="15" fill="#5d6b76" text-anchor="middle">not used</text><text x="30" y="320" font-size="15" fill="#243340" text-anchor="start">Held-out templates</text><rect x="236" y="281" width="150" height="60" rx="5" fill="#f6f7f9" stroke="#b7c3cc" /><text x="311" y="319" font-size="15" fill="#5d6b76" text-anchor="middle">not used</text><rect x="397" y="281" width="150" height="60" rx="5" fill="#f6f7f9" stroke="#b7c3cc" /><text x="472" y="319" font-size="15" fill="#5d6b76" text-anchor="middle">not used</text><rect x="558" y="281" width="150" height="60" rx="5" fill="#e8e4ef" stroke="#b7c3cc" /><text x="633" y="319" font-size="15" fill="#243340" text-anchor="middle">held-out</text><text x="30" y="397" font-size="16" fill="#243340" text-anchor="start">Generate each partition from only its assigned template and entity families.</text><text x="30" y="435" font-size="16" fill="#5d6b76" text-anchor="start">Distinct complete strings can still leak a family if either axis is shared.</text>
</g></svg>
