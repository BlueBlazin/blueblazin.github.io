<svg xmlns="http://www.w3.org/2000/svg" width="800" height="494" viewBox="0 0 800 494" role="img" aria-labelledby="title desc">
<title id="title">Fixed recurrent state can coexist with growing KV state</title><desc id="desc">For one batch item, a recurrent layer retains a fixed-shape matrix per head. A full-attention layer retains K and V entries indexed by all cached positions. The hybrid model must account for both plus any auxiliary state. The side-by-side panels are an inventory comparison, not parallel execution or a claimed layer ordering.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="494" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">A hybrid retains both kinds of state — one batch item</text><rect x="36" y="74" width="346" height="61" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="209.0" y="99.0" font-size="17" fill="#243340" text-anchor="middle">One recurrent layer</text><text x="209.0" y="122.0" font-size="17" fill="#243340" text-anchor="middle">matrix state per recurrent head</text><rect x="417" y="74" width="346" height="61" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="590.0" y="99.0" font-size="17" fill="#243340" text-anchor="middle">One full-attention layer</text><text x="590.0" y="122.0" font-size="17" fill="#243340" text-anchor="middle">K and V per cached position</text><rect x="110" y="182" width="31" height="31" rx="1" fill="#dbe7f2" stroke="#b7c3cc" /><rect x="145" y="182" width="31" height="31" rx="1" fill="#dbe7f2" stroke="#b7c3cc" /><rect x="180" y="182" width="31" height="31" rx="1" fill="#dbe7f2" stroke="#b7c3cc" /><rect x="215" y="182" width="31" height="31" rx="1" fill="#dbe7f2" stroke="#b7c3cc" /><rect x="110" y="217" width="31" height="31" rx="1" fill="#dbe7f2" stroke="#b7c3cc" /><rect x="145" y="217" width="31" height="31" rx="1" fill="#dbe7f2" stroke="#b7c3cc" /><rect x="180" y="217" width="31" height="31" rx="1" fill="#dbe7f2" stroke="#b7c3cc" /><rect x="215" y="217" width="31" height="31" rx="1" fill="#dbe7f2" stroke="#b7c3cc" /><rect x="110" y="252" width="31" height="31" rx="1" fill="#dbe7f2" stroke="#b7c3cc" /><rect x="145" y="252" width="31" height="31" rx="1" fill="#dbe7f2" stroke="#b7c3cc" /><rect x="180" y="252" width="31" height="31" rx="1" fill="#dbe7f2" stroke="#b7c3cc" /><rect x="215" y="252" width="31" height="31" rx="1" fill="#dbe7f2" stroke="#b7c3cc" /><rect x="440" y="193" width="52" height="50" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="466.0" y="224.0" font-size="16" fill="#243340" text-anchor="middle">0</text><rect x="501" y="193" width="52" height="50" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="527.0" y="224.0" font-size="16" fill="#243340" text-anchor="middle">1</text><rect x="562" y="193" width="52" height="50" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="588.0" y="224.0" font-size="16" fill="#243340" text-anchor="middle">2</text><rect x="623" y="193" width="52" height="50" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="649.0" y="224.0" font-size="16" fill="#243340" text-anchor="middle">3</text><rect x="684" y="193" width="52" height="50" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="710.0" y="224.0" font-size="16" fill="#243340" text-anchor="middle">4</text><text x="210" y="335" font-size="17" fill="#243340" text-anchor="middle">[dv,dk] per head</text><text x="590" y="335" font-size="16" fill="#243340" text-anchor="middle">[Hkv,T,D] each for K and V</text><text x="210" y="370" font-size="16" fill="#5d6b76" text-anchor="middle">widths fixed as T grows</text><text x="590" y="370" font-size="16" fill="#5d6b76" text-anchor="middle">token axis T grows</text><text x="30" y="426" font-size="15" fill="#243340" text-anchor="start">Inventory every real layer type; add any short-convolution or auxiliary state.</text><text x="30" y="465" font-size="15" fill="#5d6b76" text-anchor="start">These are component categories, not the layer order or ratio of a named model.</text>
</g></svg>
