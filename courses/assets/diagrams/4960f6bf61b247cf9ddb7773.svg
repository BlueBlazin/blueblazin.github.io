<svg xmlns="http://www.w3.org/2000/svg" width="800" height="477" viewBox="0 0 800 477" role="img" aria-labelledby="title desc">
<title id="title">Two policies allocate the same bounded input differently</title>
<desc id="desc">Both context policies preserve required system instructions, tool schemas, the original task, and constraints. Under the same model-input ceiling, recent history uses the remaining space for newest complete interaction groups. Compaction also includes a compact evidence record, leaving the remaining space for complete recent groups. The depicted allocation is schematic, not a token count or a guarantee about how many groups fit. Any summarizer calls are charged to the compaction condition, and both policies reserve output space and share total run limits.</desc>
