<svg xmlns="http://www.w3.org/2000/svg" width="800" height="516" viewBox="0 0 800 516" role="img" aria-labelledby="title desc">
<title id="title">Check the joins between modern primitives</title><desc id="desc">Input x is RMS-normalized, then projected to Q,K,V. Only Q and K receive rotary positions. Causal grouped-query attention and its output projection are added to unchanged x to create u. A second RMSNorm and SwiGLU branch is added to unchanged u to create y.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="516" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="29" font-size="18" fill="#243340" text-anchor="start" font-weight="600">A modern pre-norm block · residual width C throughout</text><rect x="28" y="71" width="103" height="43" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="79.5" y="98.5" font-size="15" fill="#243340" text-anchor="middle">x [B,T,C]</text><rect x="172" y="71" width="121" height="43" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="232.5" y="98.5" font-size="15" fill="#243340" text-anchor="middle">RMSNorm</text><line x1="131" y1="92" x2="170" y2="92" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="340" y="50" width="165" height="48" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="422.5" y="68.5" font-size="15" fill="#243340" text-anchor="middle">Q,K projections</text><text x="422.5" y="91.5" font-size="15" fill="#243340" text-anchor="middle">then RoPE</text><rect x="340" y="136" width="165" height="43" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="422.5" y="163.5" font-size="15" fill="#243340" text-anchor="middle">V projection</text><path d="M 293 92 L 314 92 L 314 74 L 338 74" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 293 92 L 314 92 L 314 157 L 338 157" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="552" y="87" width="188" height="55" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="646.0" y="109.0" font-size="15" fill="#243340" text-anchor="middle">Causal GQA</text><text x="646.0" y="132.0" font-size="15" fill="#243340" text-anchor="middle">then output projection</text><path d="M 505 74 L 528 74 L 528 104 L 550 104" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 505 157 L 528 157 L 528 128 L 550 128" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="552" y="220" width="188" height="43" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="646.0" y="247.5" font-size="15" fill="#243340" text-anchor="middle">Add → u [B,T,C]</text><line x1="646" y1="143" x2="646" y2="217" stroke="#b7c3cc" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 79 114 L 79 241 L 550 241" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><text x="248" y="232" font-size="15" fill="#5d6b76" text-anchor="start">unchanged x</text><rect x="313" y="314" width="200" height="50" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="413.0" y="333.5" font-size="15" fill="#243340" text-anchor="middle">RMSNorm → SwiGLU</text><text x="413.0" y="356.5" font-size="15" fill="#243340" text-anchor="middle">C → M → C</text><rect x="552" y="416" width="188" height="43" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="646.0" y="443.5" font-size="15" fill="#243340" text-anchor="middle">Add → y [B,T,C]</text><path d="M 606 263 L 606 286 L 413 286 L 413 312" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 413 364 L 413 437 L 550 437" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 740 241 L 772 241 L 772 437 L 742 437" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><text x="687" y="339" font-size="15" fill="#5d6b76" text-anchor="end">unchanged u</text><text x="30" y="488" font-size="15" fill="#5d6b76" text-anchor="start">No learned absolute-position addition here. RoPE changes Q and K, not V.</text>
</g></svg>
