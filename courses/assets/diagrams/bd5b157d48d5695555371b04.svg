<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Inclusive and self time describe different totals</title><desc id="desc">A serial parent interval lasts ten illustrative units. Child A occupies three units and child B two, without overlap. The parent self duration is the five remaining units. Adding the parent inclusive duration to the two children produces fifteen and double-counts those child intervals.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="450" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Nested intervals are not independent costs</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">Illustrative serial trace; the numbers are example time units, not a GPU measurement.</text><text x="30" y="137" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Parent</text><rect x="185" y="107" width="480" height="48" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="425" y="137" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">Inclusive duration = 10</text><text x="30" y="227" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Child events</text><rect x="233" y="194" width="144" height="50" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="305.0" y="225" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">A = 3</text><rect x="473" y="194" width="96" height="50" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="521" y="225" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">B = 2</text><line x1="185" y1="258" x2="185" y2="265" stroke="#b9c4d0" stroke-width="1.5"/><text x="185" y="285" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">0</text><line x1="233" y1="258" x2="233" y2="265" stroke="#b9c4d0" stroke-width="1.5"/><text x="233" y="285" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">1</text><line x1="281" y1="258" x2="281" y2="265" stroke="#b9c4d0" stroke-width="1.5"/><text x="281" y="285" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">2</text><line x1="329" y1="258" x2="329" y2="265" stroke="#b9c4d0" stroke-width="1.5"/><text x="329" y="285" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">3</text><line x1="377" y1="258" x2="377" y2="265" stroke="#b9c4d0" stroke-width="1.5"/><text x="377" y="285" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">4</text><line x1="425" y1="258" x2="425" y2="265" stroke="#b9c4d0" stroke-width="1.5"/><text x="425" y="285" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">5</text><line x1="473" y1="258" x2="473" y2="265" stroke="#b9c4d0" stroke-width="1.5"/><text x="473" y="285" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">6</text><line x1="521" y1="258" x2="521" y2="265" stroke="#b9c4d0" stroke-width="1.5"/><text x="521" y="285" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">7</text><line x1="569" y1="258" x2="569" y2="265" stroke="#b9c4d0" stroke-width="1.5"/><text x="569" y="285" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">8</text><line x1="617" y1="258" x2="617" y2="265" stroke="#b9c4d0" stroke-width="1.5"/><text x="617" y="285" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">9</text><line x1="665" y1="258" x2="665" y2="265" stroke="#b9c4d0" stroke-width="1.5"/><text x="665" y="285" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">10</text><rect x="60" y="321" width="680" height="55" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="400.0" y="354.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Self duration = 10 − 3 − 2 = 5</text><text x="30" y="415" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Adding parent 10 + children 3 + 2 counts the child intervals twice.</text></g></svg>
