<svg xmlns="http://www.w3.org/2000/svg" width="780" height="390" viewBox="0 0 780 390" role="img" aria-labelledby="title desc">
<title id="title">Resolve the destination, including parent symlinks</title>
<desc id="desc">A workspace at /tmp/lab contains a symlink named link that points to /tmp/shared outside the workspace. The relative request link/report.txt looks lexically under the workspace, but its resolved target is /tmp/shared/report.txt. The host must reject it before reading or writing. When creating a new file, inspect the resolved existing parent too. This is a controlled fixture, not a race-free hostile-filesystem guarantee.</desc>
<rect width="780" height="390" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#263445">
<rect x="25" y="53" width="307" height="260" rx="8" fill="#edf5f4" stroke="#abc9c4" stroke-width="1.5"/>
<text x="46" y="88" font-size="18" fill="#263445" font-weight="600">Workspace: /tmp/lab</text>
<rect x="48" y="116" width="260" height="57" rx="8" fill="#fff" stroke="#c7d2de" stroke-width="1.5"/>
<text x="178" y="150" font-size="16" fill="#263445" text-anchor="middle">request: link/report.txt</text>
<rect x="48" y="222" width="260" height="57" rx="8" fill="#fff" stroke="#c7d2de" stroke-width="1.5"/>
<text x="178" y="256" font-size="16" fill="#263445" font-weight="600" text-anchor="middle">link  (symlink)</text>
<path d="M178 177 L178 216" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="466" y="53" width="287" height="260" rx="8" fill="#f8fafc" stroke="#c7d2de" stroke-width="1.5"/>
<text x="487" y="88" font-size="18" fill="#263445" font-weight="600">Outside workspace</text>
<rect x="488" y="116" width="243" height="57" rx="8" fill="#fff" stroke="#c7d2de" stroke-width="1.5"/>
<text x="610" y="150" font-size="17" fill="#263445" font-weight="600" text-anchor="middle">/tmp/shared</text>
<rect x="488" y="222" width="243" height="57" rx="8" fill="#fff" stroke="#c7d2de" stroke-width="1.5"/>
<text x="610" y="256" font-size="17" fill="#263445" font-weight="600" text-anchor="middle">report.txt</text>
<path d="M311 250 L400 250 L400 145 L482 145" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="388" y="283" font-size="15" fill="#263445" text-anchor="middle">resolves to</text>
<path d="M610 177 L610 217" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="390" y="347" font-size="16" fill="#263445" font-weight="600" text-anchor="middle">Resolved target escapes → reject before file access or mutation.</text>
<text x="390" y="374" font-size="15" fill="#263445" text-anchor="middle">For a new file, resolve and check the existing parent directory as well.</text>
</g>
</svg>
