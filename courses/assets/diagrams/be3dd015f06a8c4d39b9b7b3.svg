<svg xmlns="http://www.w3.org/2000/svg" width="800" height="477" viewBox="0 0 800 477" role="img" aria-labelledby="title desc">
<title id="title">Align cached and full-prefix logit rows</title><desc id="desc">A three-token prefix a,b,c occupies positions 9,10,11. Both paths append known token d at position 12. Full recomputation processes a,b,c,d; cached execution reads retained K/V for a,b,c plus newly computed d. Compare their logits at position 12, which both predict the next position 13.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b76"/></marker></defs>
<rect width="800" height="477" fill="white"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="31" font-size="18" fill="#243340" text-anchor="start" font-weight="600">Compare the same prefix after the same append</text><text x="234" y="76" font-size="16" fill="#243340" text-anchor="middle">pos 9</text><text x="346" y="76" font-size="16" fill="#243340" text-anchor="middle">pos 10</text><text x="458" y="76" font-size="16" fill="#243340" text-anchor="middle">pos 11</text><text x="570" y="76" font-size="16" fill="#243340" text-anchor="middle">pos 12</text><text x="30" y="120" font-size="16" fill="#243340" text-anchor="start">Full path</text><text x="30" y="233" font-size="16" fill="#243340" text-anchor="start">Cached path</text><rect x="185" y="88" width="97" height="47" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="233.5" y="117.5" font-size="16" fill="#243340" text-anchor="middle">a</text><rect x="185" y="196" width="97" height="47" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="233.5" y="225.5" font-size="15" fill="#243340" text-anchor="middle">cached</text><rect x="297" y="88" width="97" height="47" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="345.5" y="117.5" font-size="16" fill="#243340" text-anchor="middle">b</text><rect x="297" y="196" width="97" height="47" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="345.5" y="225.5" font-size="15" fill="#243340" text-anchor="middle">cached</text><rect x="409" y="88" width="97" height="47" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="457.5" y="117.5" font-size="16" fill="#243340" text-anchor="middle">c</text><rect x="409" y="196" width="97" height="47" rx="5" fill="#dceee9" stroke="#b7c3cc" /><text x="457.5" y="225.5" font-size="15" fill="#243340" text-anchor="middle">cached</text><rect x="521" y="88" width="97" height="47" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="569.5" y="117.5" font-size="16" fill="#243340" text-anchor="middle">d</text><rect x="521" y="196" width="97" height="47" rx="5" fill="#dbe7f2" stroke="#b7c3cc" /><text x="569.5" y="225.5" font-size="15" fill="#243340" text-anchor="middle">d</text><text x="350" y="168" font-size="15" fill="#5d6b76" text-anchor="middle">prefill a,b,c → retained K/V</text><text x="567" y="277" font-size="15" fill="#5d6b76" text-anchor="middle">new query at pos 12</text><path d="M 570 136 L 717 136 L 717 303" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 570 244 L 684 244 L 684 303" fill="none" stroke="#5d6b76" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="457" y="307" width="307" height="56" rx="5" fill="#edf1f4" stroke="#b7c3cc" /><text x="610.5" y="329.5" font-size="16" fill="#243340" text-anchor="middle">Compare final-position logits</text><text x="610.5" y="352.5" font-size="16" fill="#243340" text-anchor="middle">both predict the token at pos 13</text><text x="30" y="411" font-size="16" fill="#243340" text-anchor="start">Compare a,b,c,d against a,b,c,d — never against the shorter a,b,c prefix.</text><text x="30" y="448" font-size="15" fill="#5d6b76" text-anchor="start">Known token d is appended in both paths; sampling is outside this test.</text>
</g></svg>
