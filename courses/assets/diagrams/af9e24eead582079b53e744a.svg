<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">A large offset can erase small input differences</title><desc id="desc">At A equal to 2 to the power 24, consecutive FP32 values above A are two apart. Under round-to-nearest ties-to-even, the exact midpoint A+1 rounds to A. Thus storing [A,A+1,A+2] yields [A,A,A+2], changing the relative differences before stable softmax can subtract a maximum.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="450" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="35" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Max subtraction cannot recover a difference already rounded away</text><text x="30" y="68" font-size="16" fill="#596579" text-anchor="start" font-weight="400">IEEE FP32 round-to-nearest, ties-to-even; A = 2²⁴ = 16,777,216.</text><text x="30" y="112" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Real values after adding A</text><text x="135" y="154" font-size="20" fill="#233449" text-anchor="middle" font-weight="400">A</text><line x1="135" y1="176" x2="135" y2="212" stroke="#426890" stroke-width="1.5"/><text x="375" y="154" font-size="20" fill="#233449" text-anchor="middle" font-weight="400">A + 1</text><line x1="375" y1="176" x2="375" y2="212" stroke="#426890" stroke-width="1.5"/><text x="615" y="154" font-size="20" fill="#233449" text-anchor="middle" font-weight="400">A + 2</text><line x1="615" y1="176" x2="615" y2="212" stroke="#426890" stroke-width="1.5"/><line x1="115" y1="215" x2="640" y2="215" stroke="#426890" stroke-width="1.5"/><path d="M 375 176 L 375 190 L 135 190 L 135 243" fill="none" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="615" y1="216" x2="615" y2="243" stroke="#426890" stroke-width="1.5" marker-end="url(#arrow)"/><text x="135" y="278" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">stored A</text><text x="615" y="278" font-size="18" fill="#233449" text-anchor="middle" font-weight="400">stored A + 2</text><rect x="35" y="321" width="730" height="55" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="400.0" y="354.5" font-size="17" fill="#233449" text-anchor="middle" font-weight="400">Stored [A, A + 1, A + 2] becomes [A, A, A + 2]</text><text x="30" y="417" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Original differences [0, 1, 2] become [0, 0, 2] before softmax runs.</text></g></svg>
