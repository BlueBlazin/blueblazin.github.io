<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Time completed work, not just submission</title><desc id="desc">An unsynchronized host timer ends after enqueueing while the GPU continues running. In a synchronized batch, finish prior device work before starting the timer, enqueue the batch, wait for completion, and then stop the timer. Warm-up and resident-input preparation happen before this timeline.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="480" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="34" font-size="19" fill="#233449" text-anchor="start" font-weight="600">Host return and GPU completion are different events</text><text x="30" y="69" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Unsynchronized interval</text><text x="30" y="119" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Host</text><text x="30" y="169" font-size="16" fill="#233449" text-anchor="start" font-weight="400">GPU</text><rect x="195" y="89" width="98" height="43" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="244" y="116" font-size="16" fill="#233449" text-anchor="middle" font-weight="400">enqueue</text><rect x="254" y="139" width="388" height="43" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="448" y="167" font-size="16" fill="#233449" text-anchor="middle" font-weight="400">device work continues</text><line x1="195" y1="80" x2="195" y2="194" stroke="#426890" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="293" y1="80" x2="293" y2="194" stroke="#426890" stroke-width="1.5" stroke-dasharray="5 5"/><text x="195" y="214" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">start</text><text x="293" y="214" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">stop</text><text x="522" y="214" font-size="16" fill="#596579" text-anchor="start" font-weight="400">No completion wait</text><text x="30" y="258" font-size="17" fill="#233449" text-anchor="start" font-weight="600">Synchronized wall-clock batch</text><text x="30" y="315" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Host</text><text x="30" y="365" font-size="16" fill="#233449" text-anchor="start" font-weight="400">GPU</text><rect x="108" y="285" width="80" height="43" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="148" y="311" font-size="15" fill="#233449" text-anchor="middle" font-weight="400">pre-sync</text><rect x="218" y="285" width="111" height="43" rx="5" fill="#e5edf7" stroke="#b9c4d0"/><text x="273" y="311" font-size="15" fill="#233449" text-anchor="middle" font-weight="400">enqueue calls</text><rect x="329" y="285" width="313" height="43" rx="5" fill="#f0f2f5" stroke="#b9c4d0"/><text x="485" y="311" font-size="16" fill="#233449" text-anchor="middle" font-weight="400">wait for completion</text><rect x="254" y="337" width="370" height="43" rx="5" fill="#e1f0ec" stroke="#b9c4d0"/><text x="439" y="364" font-size="16" fill="#233449" text-anchor="middle" font-weight="400">all timed device work</text><line x1="218" y1="278" x2="218" y2="393" stroke="#426890" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="642" y1="278" x2="642" y2="393" stroke="#426890" stroke-width="1.5" stroke-dasharray="5 5"/><text x="218" y="414" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">start</text><text x="642" y="414" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">stop</text><text x="30" y="454" font-size="17" fill="#233449" text-anchor="start" font-weight="400">Warm-up finishes first. Divide completed batch time by the call count.</text></g></svg>
