<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">The unchanged part of the model limits the gain</title><desc id="desc">An analytic Amdahl curve assumes the optimized kernel originally takes 20 percent of runtime and all other work stays fixed. Whole-step speedup is one divided by 0.8 plus 0.2 divided by kernel speedup. Doubling the kernel speed yields a whole-step speedup of about 1.11. Even an infinitely fast kernel cannot exceed 1.25 times under these assumptions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#426890" stroke-width="1.4"/></marker></defs><rect width="800" height="480" fill="white"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="36" font-size="19" fill="#233449" text-anchor="start" font-weight="600">A fast kernel may change little of the whole step</text><text x="30" y="72" font-size="16" fill="#233449" text-anchor="start" font-weight="400">Illustrative model: RMSNorm is 20% of the original runtime; all other work is fixed.</text><line x1="97" y1="356.0" x2="739" y2="356.0" stroke="#b9c4d0" stroke-width="1.5" stroke-dasharray="5 5"/><text x="82" y="361.0" font-size="15" fill="#596579" text-anchor="end" font-weight="400">1.00×</text><line x1="97" y1="270.074074074074" x2="739" y2="270.074074074074" stroke="#b9c4d0" stroke-width="1.5" stroke-dasharray="5 5"/><text x="82" y="275.074074074074" font-size="15" fill="#596579" text-anchor="end" font-weight="400">1.10×</text><line x1="97" y1="184.1481481481482" x2="739" y2="184.1481481481482" stroke="#b9c4d0" stroke-width="1.5" stroke-dasharray="5 5"/><text x="82" y="189.1481481481482" font-size="15" fill="#596579" text-anchor="end" font-weight="400">1.20×</text><line x1="97" y1="141.18518518518522" x2="739" y2="141.18518518518522" stroke="#b9c4d0" stroke-width="1.5" stroke-dasharray="5 5"/><text x="82" y="146.18518518518522" font-size="15" fill="#596579" text-anchor="end" font-weight="400">1.25×</text><line x1="97.0" y1="356" x2="97.0" y2="362" stroke="#b9c4d0" stroke-width="1.5"/><text x="97.0" y="383" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">1×</text><line x1="168.33333333333331" y1="356" x2="168.33333333333331" y2="362" stroke="#b9c4d0" stroke-width="1.5"/><text x="168.33333333333331" y="383" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">2×</text><line x1="311.0" y1="356" x2="311.0" y2="362" stroke="#b9c4d0" stroke-width="1.5"/><text x="311.0" y="383" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">4×</text><line x1="453.6666666666667" y1="356" x2="453.6666666666667" y2="362" stroke="#b9c4d0" stroke-width="1.5"/><text x="453.6666666666667" y="383" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">6×</text><line x1="596.3333333333333" y1="356" x2="596.3333333333333" y2="362" stroke="#b9c4d0" stroke-width="1.5"/><text x="596.3333333333333" y="383" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">8×</text><line x1="739.0" y1="356" x2="739.0" y2="362" stroke="#b9c4d0" stroke-width="1.5"/><text x="739.0" y="383" font-size="15" fill="#596579" text-anchor="middle" font-weight="400">10×</text><line x1="97" y1="124" x2="97" y2="356" stroke="#233449" stroke-width="1.5"/><line x1="97" y1="356" x2="739" y2="356" stroke="#233449" stroke-width="1.5"/><polyline points="97.00,356.00 100.57,347.74 104.13,340.09 107.70,332.98 111.27,326.37 114.83,320.20 118.40,314.42 121.97,309.01 125.53,303.92 129.10,299.14 132.67,294.62 136.23,290.36 139.80,286.33 143.37,282.51 146.93,278.89 150.50,275.44 154.07,272.17 157.63,269.05 161.20,266.08 164.77,263.24 168.33,260.53 171.90,257.93 175.47,255.45 179.03,253.07 182.60,250.78 186.17,248.59 189.73,246.49 193.30,244.46 196.87,242.51 200.43,240.64 204.00,238.83 207.57,237.08 211.13,235.40 214.70,23